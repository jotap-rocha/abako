[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["banco: exige o Postgres tst no ar (127.0.0.1:5433); nunca com mock"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "config", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = [
  "db",
  "backend",
  "tests/backend",
  "tests/db",
  "tests/conftest.py",
  "tests/test_check.py",
  "tests/test_rastreabilidade.py",
  "tests/test_retencao_backup.py",
  "tests/test_conteiner.py",
  "tests/test_evidence_gate_ref.py",
  "tests/test_compose_scram.py",
  "tests/test_agent_policies_backup.py",
  "scripts/check.py",
  "scripts/rastreabilidade.py",
  "scripts/backup.py",
  "scripts/restaurar.py",
  "scripts/resumo_banco.py",
  "scripts/criar_descartavel.py",
]
strict = true

[[tool.mypy.overrides]]
module = ["yaml", "alembic", "alembic.*"]
ignore_missing_imports = true
