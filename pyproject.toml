[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "config", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["db", "tests/db", "tests/conftest.py"]
strict = true

[[tool.mypy.overrides]]
module = ["yaml", "alembic", "alembic.*"]
ignore_missing_imports = true
