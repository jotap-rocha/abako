# agent-policies.yaml — Fonte única do kernel anti-destrutivo (runtime Bash/CLI)
#
# Schema mínimo:
#   version: int (>= 1)
#   core_families: lista de IDs always-on no install
#   families.<id>:
#     description: string
#     core: bool
#     enabled_by_default: bool (extras opt-in = false)
#     patterns.<pattern_id>:
#       severity: deny | ask   (deny = deny-hard)
#       match: regex (search no comando shell)
#       tool_deny: string Claude permissions.deny (ex.: Bash(rm -rf:*))
#       message: string auditável (family/pattern na decisão)
#
# Patterns são mapping (não lista-de-maps) — subset do yaml_loader stdlib.
# Consumidores (matcher, generate, hooks, install) DEVEM carregar este arquivo.
# DE-A002 permanece ortogonal (código versionado DE ≠ gate de sessão Bash).
# Honesty §1.3: deny/hooks locais ≠ Edit policies server-side.

version: 1

core_families:
  - shell
  - docker
  - git
  - sql-cli
  - databricks-cli
  - terraform
  - k8s
  - abako

families:
  shell:
    description: Ops destrutivas de filesystem Linux
    core: true
    enabled_by_default: true
    patterns:
      rm-rf:
        severity: deny
        match: '(^|[;&|]\s*)rm\s+(-[^\s]*r[^\s]*f|-[^\s]*f[^\s]*r)\b'
        tool_deny: "Bash(rm -rf:*)"
        message: "Remoção recursiva forçada bloqueada"
      mkfs:
        severity: deny
        match: '(^|[;&|]\s*)mkfs(\.\w+)?\b'
        tool_deny: "Bash(mkfs:*)"
        message: "Formatação de filesystem bloqueada"

  docker:
    description: Docker volumes e compose destrutivo
    core: true
    enabled_by_default: true
    patterns:
      compose-down-v:
        severity: deny
        match: 'docker\s+compose\s+down\s+.*(-v|--volumes)\b'
        tool_deny: "Bash(docker compose down -v:*)"
        message: "docker compose down com volumes bloqueado"
      compose-down-volumes:
        severity: deny
        match: 'docker\s+compose\s+down\s+.*--volumes\b'
        tool_deny: "Bash(docker compose down --volumes:*)"
        message: "docker compose down --volumes bloqueado"
      volume-rm:
        severity: deny
        match: 'docker\s+volume\s+rm\b'
        tool_deny: "Bash(docker volume rm:*)"
        message: "docker volume rm bloqueado"
      volume-prune:
        severity: deny
        match: 'docker\s+volume\s+prune\b'
        tool_deny: "Bash(docker volume prune:*)"
        message: "docker volume prune bloqueado"

  git:
    description: Git force/reset — ask (recuperável com dor)
    core: true
    enabled_by_default: true
    patterns:
      push-force:
        severity: ask
        match: 'git\s+push\s+.*(--force|-f)\b'
        tool_deny: "Bash(git push --force:*)"
        message: "git push --force exige confirmação humana"
      reset-hard:
        severity: ask
        match: 'git\s+reset\s+--hard\b'
        tool_deny: "Bash(git reset --hard:*)"
        message: "git reset --hard exige confirmação humana"
      clean-fdx:
        severity: ask
        match: 'git\s+clean\s+.*-[^\s]*f[^\s]*d[^\s]*x'
        tool_deny: "Bash(git clean -fdx:*)"
        message: "git clean -fdx exige confirmação humana"

  sql-cli:
    description: CLIs SQL destrutivas (drop database)
    core: true
    enabled_by_default: true
    patterns:
      dropdb:
        severity: deny
        match: '(^|[;&|]\s*)dropdb\b'
        tool_deny: "Bash(dropdb:*)"
        message: "dropdb bloqueado"
      mysqladmin-drop:
        severity: deny
        match: 'mysqladmin\s+.*\bdrop\b'
        tool_deny: "Bash(mysqladmin drop:*)"
        message: "mysqladmin drop bloqueado"
      sql-drop-table:
        severity: deny
        match: '(?i)\b(DROP|TRUNCATE)\s+(TABLE|DATABASE|SCHEMA)\b'
        tool_deny: "Bash(*DROP TABLE*)"
        message: "DDL DROP/TRUNCATE via CLI bloqueado"

  databricks-cli:
    description: Databricks CLI — deletes recuperáveis com dor = ask
    core: true
    enabled_by_default: true
    patterns:
      workspace-delete:
        severity: ask
        match: 'databricks\s+workspace\s+delete\b'
        tool_deny: "Bash(databricks workspace delete:*)"
        message: "databricks workspace delete exige confirmação"
      clusters-delete:
        severity: ask
        match: 'databricks\s+clusters\s+delete\b'
        tool_deny: "Bash(databricks clusters delete:*)"
        message: "databricks clusters delete exige confirmação"
      jobs-delete:
        severity: ask
        match: 'databricks\s+jobs\s+delete\b'
        tool_deny: "Bash(databricks jobs delete:*)"
        message: "databricks jobs delete exige confirmação"

  terraform:
    description: Terraform destroy irreversível
    core: true
    enabled_by_default: true
    patterns:
      destroy:
        severity: deny
        match: 'terraform\s+destroy\b'
        tool_deny: "Bash(terraform destroy:*)"
        message: "terraform destroy bloqueado"
      apply-destroy:
        severity: deny
        match: 'terraform\s+apply\s+.*-destroy\b'
        tool_deny: "Bash(terraform apply -destroy:*)"
        message: "terraform apply -destroy bloqueado"

  k8s:
    description: kubectl delete amplo
    core: true
    enabled_by_default: true
    patterns:
      delete-all:
        severity: deny
        match: 'kubectl\s+delete\s+.*(--all|-A|--all-namespaces)\b'
        tool_deny: "Bash(kubectl delete --all:*)"
        message: "kubectl delete amplo bloqueado"
      delete-ns:
        severity: deny
        match: 'kubectl\s+delete\s+(ns|namespace)\b'
        tool_deny: "Bash(kubectl delete namespace:*)"
        message: "kubectl delete namespace bloqueado"
      drain:
        severity: deny
        match: 'kubectl\s+drain\b'
        tool_deny: "Bash(kubectl drain:*)"
        message: "kubectl drain bloqueado"

  abako:
    description: Guardrails do abako (ADR 019) - segredos, dados, rede, repo, prd
    core: true
    enabled_by_default: true
    patterns:
      env-read-shell:
        severity: deny
        match: '(?i)\b(cat|type|more|less|head|tail|grep|rg|sed|awk|source|get-content|gc|select-string|sls)\b[^|;&]*\.env(?!\.example)\b'
        tool_deny: "Bash(cat .env:*)"
        message: "Leitura de .env via shell bloqueada (ADR 019 A)"
      env-write-shell:
        severity: deny
        match: '(?i)(>>?|\btee\b|set-content|add-content|out-file|\bsc\b)[^|;&]*\.env(?!\.example)\b'
        tool_deny: "Bash(tee .env:*)"
        message: "Escrita em .env via shell bloqueada (ADR 019 A)"
      data-read-shell:
        severity: deny
        match: '(?i)\b(cat|type|more|less|head|tail|cp|copy|mv|move|get-content|gc|xcopy|robocopy|duckdb)\b[^|;&]*(\bbackups?[\\/]|\bdata[\\/]|\.duckdb\b|\.dump\b|\.age\b|\.pgpass)'
        tool_deny: "Bash(cat backups:*)"
        message: "Acesso a dados, backups, dumps ou .duckdb via shell bloqueado (ADR 019 A)"
      remove-item-recurse-force:
        severity: deny
        match: '(?i)\b(remove-item|ri|rd|rmdir|del)\b(?=[^|;&]*(-recurse|\s/s\b))(?=[^|;&]*(-force|\s/q\b))'
        tool_deny: "Bash(Remove-Item -Recurse -Force:*)"
        message: "Remocao recursiva forcada (PowerShell/cmd) bloqueada"
      external-upload:
        severity: deny
        match: '(?i)\b(curl|wget|invoke-webrequest|iwr|invoke-restmethod|irm|scp|sftp|ftp|nc|ncat)\b(?![^|;&]*(localhost|127\.0\.0\.1|\[::1\]))'
        tool_deny: "Bash(curl https:*)"
        message: "Envio/acesso a servico externo bloqueado; use dado sintetico se necessario (ADR 019 A)"
      repo-visibility:
        severity: deny
        match: '\bgh\s+repo\s+(edit\b[^|;&]*--visibility|fork\b|delete\b)'
        tool_deny: "Bash(gh repo edit --visibility:*)"
        message: "Alterar visibilidade, fork ou excluir repositorio so pelo usuario (ADR 019 A)"
      foreign-postgres-port:
        severity: deny
        match: '(?i)\b(psql|pg_dump|pg_dumpall|pg_restore|createdb|dropdb|pg_isready)\b[^|;&]*((-p\s*|--port[= ])5432\b|:5432\b)'
        tool_deny: "Bash(psql -p 5432:*)"
        message: "Porta 5432 e do Postgres de outro projeto; o abako usa porta propria (ADR 014/019)"
      git-commit:
        severity: ask
        match: '\bgit\s+commit\b'
        tool_deny: "Bash(git commit:*)"
        message: "git commit exige acordo explicito (rules/git-hygiene)"
      git-push:
        severity: ask
        match: '\bgit\s+push\b'
        tool_deny: "Bash(git push:*)"
        message: "git push exige acordo explicito (rules/git-hygiene)"
      psql-any:
        severity: ask
        match: '(?i)\b(psql|pg_dump|pg_dumpall|pg_restore|createdb)\b'
        tool_deny: "Bash(psql:*)"
        message: "Acesso ao Postgres: confirme banco (tst) e host/porta do conteiner do projeto"
      psql-dml-ddl:
        severity: ask
        match: '(?i)\b(psql|docker\s+exec)\b.*\b(delete\s+from|update\s+\w+\s+set|alter\s+(table|role|database)|grant|revoke|insert\s+into)\b'
        tool_deny: "Bash(psql -c:*)"
        message: "Comando que altera dados/esquema via psql passa pelo crivo do usuario (ADR 019 B)"
      migrate-prd:
        severity: ask
        match: '(?i)\b(alembic|migrate)\b[^|;&]*\bprd\b|\b(abako_env|env)=prd\b'
        tool_deny: "Bash(alembic upgrade prd:*)"
        message: "Migracao em prd exige confirmacao (ADR 019 B)"
      deploy-local:
        severity: ask
        match: '(?i)deploy-local'
        tool_deny: "Bash(scripts/deploy-local:*)"
        message: "Deploy local exige confirmacao (ADR 019 B)"
      install-deps:
        severity: ask
        match: '(?i)\b(pip3?|uv|poetry|pipx)\s+(install|add|sync)\b|\b(npm|pnpm|yarn)\s+(install|i|add|ci)\b|\bnpx\s+(-y\s+)?skills\s+add\b|\b(winget|choco|scoop)\s+install\b'
        tool_deny: "Bash(pip install:*)"
        message: "Instalar dependencia exige confirmacao (ADR 019 B)"
      delete-files:
        severity: ask
        match: '(?i)(^|[;&|]\s*)(rm|del|erase|rmdir|rd|remove-item|ri|git\s+rm)\b'
        tool_deny: "Bash(rm:*)"
        message: "Apagar arquivos exige confirmacao (ADR 019 B)"
      third-party-issues-prs:
        severity: ask
        match: '\bgh\s+(issue\s+(view|list)|pr\s+(view|list|diff|checks)|api\b[^|;&]*(issues|pulls|comments))'
        tool_deny: "Bash(gh issue view:*)"
        message: "Issues/PRs de terceiros sao conteudo nao confiavel; confirme a leitura (ADR 019 B)"

  # Extra (opt-in via profile) — presente no catálogo, desligado por default
  cloud-cli-extra:
    description: CLIs cloud extras (opt-in)
    core: false
    enabled_by_default: false
    patterns:
      aws-s3-rb:
        severity: deny
        match: 'aws\s+s3\s+rb\b'
        tool_deny: "Bash(aws s3 rb:*)"
        message: "aws s3 rb bloqueado (extra opt-in)"
