name: CI

# CI mínimo (ADR 022): sem segredos, permissões mínimas, ações fixadas por SHA.
# Job `check` (SPEC-001b): ruff, mypy, pytest com Postgres efêmero, contratos e rastreabilidade.
# Vitest e Playwright entram em jobs próprios quando existir `frontend/` (task do frontend);
# até lá o `check` não os executa. Esses jobs devem usar setup-node fixado por SHA.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks 8.30.1 (checksum fixo)
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Varredura do histórico e da árvore
        run: |
          ./gitleaks git --redact --no-banner --config .gitleaks.toml
          ./gitleaks dir . --redact --no-banner --config .gitleaks.toml

  workflows:
    name: workflows (actionlint + zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar actionlint 1.7.12 (checksum fixo)
        run: |
          curl -sSfL -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint

      - name: actionlint
        run: ./actionlint -color

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: zizmor
        run: |
          python -m pip install --disable-pip-version-check zizmor==1.31.1
          zizmor --offline --format plain .github

  contratos:
    name: contratos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Dependências
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Invariantes, fixtures e critérios
        run: python scripts/validar_contratos.py

      - name: Catálogo de guardrails (agent-policies)
        run: python -m config.agent_policies check

  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Postgres efêmero, descartado com o runner. Credenciais fictícias de uso único (não são
    # segredo: o banco só existe durante o job). Porta publicada só em loopback, como o compose.
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: ci_owner
          POSTGRES_PASSWORD: ci-efemero
          POSTGRES_DB: tst
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd "pg_isready -U ci_owner -d tst"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ABAKO_ENV: tst
      ABAKO_DB_MIGRATE_URL_TST: postgresql://ci_owner:ci-efemero@127.0.0.1:5433/tst
      # Papéis de runtime (task 03): senhas fictícias de uso único, só neste banco efêmero.
      ABAKO_ADMIN_USER: ci_owner
      ABAKO_APP_PASSWORD: ci-app-efemero
      ABAKO_PIPELINE_PASSWORD: ci-pipeline-efemero
      ABAKO_DB_APP_URL: postgresql://abako_app:ci-app-efemero@127.0.0.1:5433/tst
      ABAKO_DB_PIPELINE_URL: postgresql://abako_pipeline:ci-pipeline-efemero@127.0.0.1:5433/tst
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Dependências (versões exatas)
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Papéis do banco (passo de admin, como no ambiente local)
        env:
          ABAKO_ADMIN_PASSWORD_FILE: ${{ runner.temp }}/admin-efemero.txt
        run: |
          printf '%s' 'ci-efemero' > "$ABAKO_ADMIN_PASSWORD_FILE"
          python -m scripts.criar_papeis

      - name: check completo (exige o banco tst)
        run: python -m scripts.check --com-banco
