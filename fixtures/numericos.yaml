# Fixtures numéricas — valores INVENTADOS, sem relação com dados reais.
# "pessoa_b" é uma pessoa genérica. Valores monetários em string decimal (nunca float).
# Cada fixture cita as invariantes que exercita.
versao: 1
moeda: BRL
fixtures:

  - id: F-TRANSF-01
    invariantes: [INV-01, INV-04]
    descricao: Transferência entre contas tem duas pernas que somam zero e não é gasto real.
    entrada:
      - {conta: corrente, valor: "-300.00", tipo: transferencia, perna: saida}
      - {conta: reserva, valor: "300.00", tipo: transferencia, perna: entrada}
    esperado:
      soma_pernas: "0.00"
      gasto_real: "0.00"

  - id: F-PARC-01
    invariantes: [INV-02]
    descricao: Última parcela absorve os centavos.
    entrada: {compra: "100.00", parcelas: 3}
    esperado:
      parcelas: ["33.33", "33.33", "33.34"]
      soma: "100.00"

  - id: F-PARC-02
    invariantes: [INV-02]
    descricao: Parcelamento com resto maior.
    entrada: {compra: "1000.00", parcelas: 6}
    esperado:
      parcelas: ["166.66", "166.66", "166.66", "166.66", "166.66", "166.70"]
      soma: "1000.00"

  - id: F-SALDO-01
    invariantes: [INV-03, INV-23]
    descricao: Saldo derivado a partir do snapshot e divergência com novo snapshot.
    entrada:
      snapshot: {data: "2026-01-10", valor: "1000.00"}
      transacoes_posteriores:
        - {data: "2026-01-11", tipo: debito, valor: "-50.00"}
        - {data: "2026-01-12", tipo: receita, valor: "200.00"}
        - {data: "2026-01-13", tipo: transferencia, valor: "-100.00"}
      novo_snapshot: {data: "2026-01-14", valor: "1040.00"}
    esperado:
      saldo_derivado_em_2026_01_14: "1050.00"
      divergencia: "10.00"
      sinalizada_em_r4: true
      corrigida_automaticamente: false

  - id: F-SALDO-02
    invariantes: [INV-03, INV-09]
    descricao: Transação editada conta uma vez (versão vigente); excluída logicamente não conta.
    entrada:
      snapshot: {data: "2026-02-01", valor: "500.00"}
      transacoes:
        - {id: t1, versoes: [{valor: "-80.00"}, {valor: "-60.00"}]}
        - {id: t2, versoes: [{valor: "-20.00"}], excluida: true}
    esperado:
      saldo_derivado: "440.00"
      historico_t1: 2

  - id: F-SALDO-03
    invariantes: [INV-03, INV-23, INV-30]
    descricao: >-
      Edição retroativa de transação anterior a um snapshot não altera o snapshot; o R4
      compara o snapshot com o derivado desde o snapshot anterior e sinaliza a divergência.
      Snapshot vale para o fim do dia; divergência = derivado - snapshot (ADR 041).
    entrada:
      snapshot_1: {data: "2026-01-10", valor: "1000.00"}
      transacao: {id: t1, data: "2026-01-11", versoes: [{valor: "-50.00"}, {valor: "-60.00"}]}
      snapshot_2: {data: "2026-01-14", valor: "950.00"}
    esperado:
      antes_da_edicao:
        saldo_derivado_em_2026_01_12: "950.00"
        saldo_derivado_em_2026_01_14: "950.00"
        r4: []
      depois_da_edicao:
        saldo_derivado_em_2026_01_12: "940.00"
        # No dia do snapshot a âncora é o próprio snapshot (INV-03); os 940.00 do derivado
        # desde o snapshot anterior aparecem no R4 abaixo.
        saldo_em_2026_01_14: "950.00"
        saldo_atual: "950.00"
        snapshot_2_valor: "950.00"
        r4:
          - {data_snapshot: "2026-01-14", valor_snapshot: "950.00", saldo_derivado: "940.00", divergencia: "-10.00"}
        corrigida_automaticamente: false

  - id: F-GASTO-01
    invariantes: [INV-04, INV-05, INV-11, INV-20]
    descricao: O gasto real do mês exclui tudo que não é consumo próprio.
    entrada:
      mes: "2026-03"
      itens:
        - {tipo: debito, valor: "120.00", pessoa: propria}
        - {tipo: credito_parcela, valor: "80.00", pessoa: propria}
        - {tipo: credito_parcela, valor: "50.00", pessoa: pessoa_b}
        - {tipo: pagamento_fatura, valor: "900.00"}
        - {tipo: transferencia, valor: "300.00"}
        - {tipo: investimento, valor: "200.00"}
        - {tipo: repasse, valor: "50.00"}
        - {tipo: rendimento, valor: "10.00"}
        - {tipo: debito, valor: "40.00", conta: beneficio}
    esperado:
      gasto_real: "200.00"

  - id: F-LIM-01
    invariantes: [INV-06, INV-26]
    descricao: Limite usado pelo valor total da compra, incluindo terceiros e parcelas futuras.
    entrada:
      linha: {limite: "5000.00"}
      compras:
        - {cartao: X, total: "1200.00", parcelas: 4, pessoa: propria}
        - {cartao: Y, total: "300.00", parcelas: 1, pessoa: pessoa_b}
    esperado:
      limite_usado: "1500.00"
      limite_disponivel: "3500.00"

  - id: F-FAT-01
    invariantes: [INV-07, INV-10, INV-26]
    descricao: Total da fatura = própria + terceiros; a receber por pessoa abatido pelo repasse.
    entrada:
      fatura: {competencia: "2026-04"}
      itens:
        - {valor: "600.00", pessoa: propria}
        - {valor: "400.00", pessoa: pessoa_b}
      repasses: [{pessoa: pessoa_b, valor: "250.00"}]
    esperado:
      fatura_total: "1000.00"
      fatura_propria: "600.00"
      a_receber_pessoa_b: "150.00"

  - id: F-EST-01
    invariantes: [INV-08, INV-06]
    descricao: Estorno integral (nenhuma parcela paga).
    entrada:
      compra: {total: "400.00", parcelas: 4, pagas: 0}
      estorno: integral
    esperado:
      limite_devolvido: "400.00"
      reduz_fatura_aberta: "100.00"
      movimento_em_conta_corrente: "0.00"
      liquido_da_compra: "0.00"

  - id: F-EST-02
    invariantes: [INV-08, INV-06]
    descricao: Estorno com 1 parcela já paga; paga vira crédito na próxima fatura aberta.
    entrada:
      compra: {total: "400.00", parcelas: 4, pagas: 1}
      estorno: apos_pagamento_parcial
    esperado:
      limite_devolvido: "300.00"
      credito_proxima_fatura_aberta: "100.00"
      movimento_em_conta_corrente: "0.00"
      liquido_da_compra: "0.00"

  - id: F-EST-03
    invariantes: [INV-08, INV-06]
    descricao: >-
      Estorno após pagamento parcial que não é múltiplo de parcela (ADR 044). Alocação em ordem de
      competência: parcela 1 quitada (100) e parcela 2 paga em parte (50).
    entrada:
      compra: {total: "400.00", parcelas: 4}
      pagamentos: ["150.00"]
      estorno: integral_da_compra
    esperado:
      pago_alocado: "150.00"
      limite_devolvido: "250.00"
      credito_proxima_fatura_aberta: "150.00"
      movimento_em_conta_corrente: "0.00"
      liquido_da_compra: "0.00"
      saldo_cartao_antes: "-250.00"
      saldo_cartao_depois: "150.00"

  - id: F-EST-04
    invariantes: [INV-08, INV-06]
    descricao: >-
      Duas compras no mesmo cartão e um pagamento solto de 250 (ADR 044). A alocação segue
      competência, data da compra e parcela: A1 (2026-03) 100, A2 (2026-04) 100, B (2026-04,
      comprada depois de A) 50. O crédito de um estorno sai do pool (A estornada: pool 250-200 = 50,
      que passa para B).
    entrada:
      compra_A: {total: "400.00", parcelas: 4, primeira_competencia: "2026-03", data: "2026-03-05"}
      compra_B: {total: "200.00", parcelas: 1, competencia: "2026-04", data: "2026-03-20"}
      pagamentos: ["250.00"]
    casos:
      - estorno: B
        pago_alocado: "50.00"
        limite_devolvido: "150.00"
        credito_proxima_fatura_aberta: "50.00"
        liquido_da_compra: "0.00"
      - estorno: A
        pago_alocado: "200.00"
        limite_devolvido: "200.00"
        credito_proxima_fatura_aberta: "200.00"
        liquido_da_compra: "0.00"
        pago_alocado_a_B_depois: "50.00"

  - id: F-EST-05
    invariantes: [INV-08, INV-06]
    descricao: >-
      Pagamento maior que a dívida: o saldo do cartão já está positivo; o estorno credita o total
      da compra e o excedente do pagamento continua no pool (ADR 044).
    entrada:
      compra: {total: "400.00", parcelas: 4}
      pagamentos: ["500.00"]
      estorno: integral_da_compra
    esperado:
      saldo_cartao_antes: "100.00"
      pago_alocado: "400.00"
      limite_devolvido: "0.00"
      credito_proxima_fatura_aberta: "400.00"
      movimento_em_conta_corrente: "0.00"
      liquido_da_compra: "0.00"
      saldo_cartao_depois: "500.00"
      pool_restante: "100.00"

  - id: F-EST-06
    invariantes: [INV-08, INV-09]
    descricao: >-
      Edição e exclusão de compra com parte paga são recusadas (ADR 044 item 8). Compra 400 em 4x com
      pagamento de 150, tentativa de editar para total 600 (ou excluir). Nada muda.
    entrada:
      compra: {total: "400.00", parcelas: 4}
      pagamentos: ["150.00"]
      edicao: {total: "600.00", parcelas: 4}
    esperado:
      edicao_aceita: false
      pago_alocado: "150.00"
      saldo_cartao: "-250.00"
      limite_usado: "250.00"
      compra_vigente: {total: "400.00", parcelas: 4}

  - id: F-RES-01
    invariantes: [INV-12, INV-17]
    descricao: Níveis da reserva nos cortes de 50% e 100%. Meta = 12000.00.
    entrada: {meta: "12000.00"}
    casos:
      - {saldo: "3000.00", nivel: critica, falta: "9000.00"}
      - {saldo: "5999.99", nivel: critica}
      - {saldo: "6000.00", nivel: atencao}
      - {saldo: "11999.99", nivel: atencao}
      - {saldo: "12000.00", nivel: saudavel, falta: "0.00"}
    aporte_mensal_ate_data_alvo:
      saldo: "3000.00"
      meses_ate_alvo: 6
      aporte: "1500.00"

  - id: F-RES-02
    invariantes: [INV-12]
    descricao: Cobertura em meses.
    entrada: {saldo_reserva: "9000.00", gasto_essencial: "3000.00"}
    esperado: {cobertura_meses: "3.00", meta_meses: 3, nivel: saudavel}

  # ---- SPEC-009 (ADR 047): reserva, bruto/líquido, cobertura e aporte (contas à mão) ----

  - id: F-RES-03
    invariantes: [INV-12, INV-36, INV-37]
    descricao: >-
      Bruto, imposto acumulado e líquido da reserva (ADR 034). Uma reserva com saldo inicial e
      dois rendimentos; o rendimento excluído e o rendimento em conta de investimento não contam.
    entrada:
      hoje: "2026-04-01"
      parametros: {desde: "2026-01-01", meses: 3, gasto_essencial: "1500.00"}
      reserva:
        snapshot: {data: "2026-01-01", valor: "5000.00"}
        rendimentos:
          - {data: "2026-02-10", bruto: "100.00", imposto: "22.50"}   # liquido 77.50
          - {data: "2026-03-10", bruto: "80.00", imposto: "18.00"}    # liquido 62.00
      ignorados:
        - {conta: reserva, rendimento_excluido: {bruto: "50.00", imposto: "10.00"}}
        - {conta: investimento, rendimento: {bruto: "200.00", imposto: "40.00"}}
    esperado:
      saldo_liquido: "5139.50"        # 5000.00 + 77.50 + 62.00
      imposto_acumulado: "40.50"      # 22.50 + 18.00
      saldo_bruto: "5180.00"          # 5139.50 + 40.50
      meta: "4500.00"                 # 3 x 1500.00
      nivel: saudavel
      falta: "0.00"
      cobertura_meses: "3.43"         # liquido: 5139.50 / 1500.00 = 3.4263..
      cobertura_se_usasse_bruto: "3.45"   # 5180.00 / 1500.00 = 3.4533.. (errado: nao e usado)

  - id: F-RES-04
    invariantes: [INV-12, INV-37]
    descricao: >-
      Soma de duas reservas (caixinhas de bancos diferentes); investimento fica fora. Isoladas,
      uma é atenção e a outra crítica; somadas, saudável.
    entrada:
      hoje: "2026-04-01"
      parametros: {desde: "2026-01-01", meses: 3, gasto_essencial: "2000.00"}
      reservas:
        - {nome: caixinha_a, snapshot: {data: "2026-01-01", valor: "4000.00"}}
        - nome: caixinha_b
          snapshot: {data: "2026-01-01", valor: "2500.00"}
          rendimentos: [{data: "2026-02-10", bruto: "100.00", imposto: "22.50"}]
      investimento: {snapshot: {data: "2026-01-01", valor: "10000.00"}}
    esperado:
      saldo_liquido: "6577.50"        # 4000.00 + (2500.00 + 77.50)
      imposto_acumulado: "22.50"
      saldo_bruto: "6600.00"
      meta: "6000.00"                 # 3 x 2000.00
      nivel: saudavel                 # 6577.50 >= 6000.00 (A sozinha: atencao; B sozinha: critica)
      falta: "0.00"
      cobertura_meses: "3.29"         # 6577.50 / 2000.00 = 3.28875
      contas_reserva: 2
    troca_de_tipo:   # a caixinha B vira investimento: sai da soma, com o imposto dela (tipo VIGENTE)
      saldo_liquido: "4000.00"
      imposto_acumulado: "0.00"
      saldo_bruto: "4000.00"
      contas_reserva: 1

  - id: F-RES-05
    invariantes: [INV-12]
    descricao: >-
      Aporte mensal até a data-alvo: meses civis entre hoje e a data-alvo (mínimo 1), arredondado
      para cima em centavos. Meta 12000.00 (3 x 4000.00). O caso exato é o de F-RES-01.
    entrada:
      hoje: "2026-04-15"
      parametros: {meses: 3, gasto_essencial: "4000.00"}
    casos:
      - {saldo: "3000.00", data_alvo: "2026-10-20", meses_ate_alvo: 6, falta: "9000.00", aporte: "1500.00"}
      - {saldo: "3000.00", data_alvo: "2026-11-03", meses_ate_alvo: 7, falta: "9000.00", aporte: "1285.72"}   # 9000/7 = 1285.714..
      - {saldo: "11000.00", data_alvo: "2026-07-01", meses_ate_alvo: 3, falta: "1000.00", aporte: "333.34"}   # 1000/3 = 333.333..
      - {saldo: "3000.00", data_alvo: "2027-02-01", meses_ate_alvo: 10, falta: "9000.00", aporte: "900.00"}  # vira o ano: 12-4+2 = 10
      - {saldo: "3000.00", data_alvo: "2026-04-30", meses_ate_alvo: 1, falta: "9000.00", aporte: "9000.00"}  # mesmo mes: minimo 1
      - {saldo: "3000.00", data_alvo: "2026-03-31", alvo_vencida: true, falta: "9000.00", aporte: null}     # passada: so a falta
      - {saldo: "12000.00", data_alvo: "2026-10-20", falta: "0.00", aporte: "0.00"}                         # meta atingida
      - {saldo: "3000.00", data_alvo: null, falta: "9000.00", aporte: null}                                 # sem data-alvo
      # meta atingida com data-alvo vencida: aporte 0,00; nao ha meses ate o alvo e alvo_vencida
      # fica falso (so a falta gera "vencida": sem falta, nao ha aporte a cobrar)
      - {saldo: "12000.00", data_alvo: "2026-03-31", meses_ate_alvo: null, alvo_vencida: false, falta: "0.00", aporte: "0.00"}

  - id: F-RES-06
    invariantes: [INV-12]
    descricao: Cobertura em meses, 2 casas, arredondamento meio-para-cima (complementa F-RES-02).
    casos:
      - {saldo: "1000.00", gasto_essencial: "3000.00", cobertura_meses: "0.33"}   # 0.3333..
      - {saldo: "2000.00", gasto_essencial: "3000.00", cobertura_meses: "0.67"}   # 0.6666..
      - {saldo: "1.00", gasto_essencial: "200.00", cobertura_meses: "0.01"}       # empate 0.005 sobe
      - {saldo: "9000.00", gasto_essencial: "3000.00", cobertura_meses: "3.00"}
      # saldo negativo: meio-para-cima = floor(x*100 + 0,5)/100; o empate -0,005 sobe para 0,00
      - {saldo: "-1.00", gasto_essencial: "200.00", cobertura_meses: "0.00"}    # -0.005 -> -0.5+0.5=0 -> 0.00
      - {saldo: "-3.00", gasto_essencial: "200.00", cobertura_meses: "-0.01"}   # -0.015 -> -1.5+0.5=-1 -> -0.01
      - {saldo: "-500.00", gasto_essencial: "3000.00", cobertura_meses: "-0.17"}  # -0.1666.. -> -16.17 -> floor -17

  - id: F-RES-07
    invariantes: [INV-12]
    descricao: >-
      Gasto essencial ausente (nunca informado) ou zero: configuração pendente; cobertura, meta,
      nível, falta e aporte ficam nulos (não é alerta R1). O saldo continua sendo mostrado.
    entrada:
      hoje: "2026-04-01"
      reserva: {snapshot: {data: "2026-01-01", valor: "3000.00"}}
      casos: [sem_parametro, gasto_essencial_zero]
    esperado:
      saldo_liquido: "3000.00"
      meses_meta: 3                   # padrão do ADR 007
      config_pendente: true
      cobertura_meses: null
      meta: null
      nivel: null
      falta: null
      aporte_mensal: null

  - id: F-RES-08
    invariantes: [INV-12, INV-17]
    descricao: >-
      Parâmetros com vigência: vale o registro de maior `desde` não posterior a hoje; no mesmo
      `desde` vale o último gravado. O corte de 50% é exato (5000.00 de 10000.00 = atenção).
    entrada:
      reserva: {snapshot: {data: "2025-01-01", valor: "5000.00"}}
      parametros:
        - {desde: "2026-01-01", meses: 3, gasto_essencial: "2000.00"}
        - {desde: "2026-06-01", meses: 4, gasto_essencial: "2500.00"}
    casos:
      - {hoje: "2025-12-31", config_pendente: true}
      - {hoje: "2026-05-31", meta: "6000.00", nivel: atencao, cobertura_meses: "2.50", falta: "1000.00"}
      - {hoje: "2026-06-01", meta: "10000.00", nivel: atencao, cobertura_meses: "2.00", falta: "5000.00"}
    regravado:
      parametro: {desde: "2026-06-01", meses: 4, gasto_essencial: "2800.00"}
      caso: {hoje: "2026-06-01", meta: "11200.00", cobertura_meses: "1.79"}   # 5000.00 / 2800.00 = 1.7857..

  - id: F-R2-01
    invariantes: [INV-18, INV-19]
    descricao: Sobra do R2 positiva.
    entrada:
      hoje: "2026-05-10"
      horizonte_dias: 10
      saldos_correntes: "5000.00"
      receita_recorrente_pendente: "3000.00"
      fixos_pendentes: "2500.00"
      fatura_propria_no_horizonte: "4200.00"
    esperado: {disponivel: "8000.00", compromissos: "6700.00", sobra: "1300.00", alerta: false}

  - id: F-R2-02
    invariantes: [INV-18, INV-19]
    descricao: Sobra do R2 negativa dispara alerta.
    entrada:
      saldos_correntes: "5000.00"
      receita_recorrente_pendente: "3000.00"
      fixos_pendentes: "2500.00"
      fatura_propria_no_horizonte: "6000.00"
    esperado: {disponivel: "8000.00", compromissos: "8500.00", sobra: "-500.00", alerta: true}

  - id: F-R2-03
    invariantes: [INV-18, INV-26]
    descricao: Terceiros e crédito do vale não entram na sobra.
    entrada:
      saldos_correntes: "5000.00"
      receita_recorrente_pendente: "3000.00"
      fixos_pendentes: "2500.00"
      fatura_total_no_horizonte: "5000.00"
      fatura_terceiros: "800.00"
      credito_vale_no_mes: "1000.00"
    esperado:
      fatura_propria: "4200.00"
      sobra: "1300.00"
      exibicao_fatura: "total 5000.00 = propria 4200.00 + terceiros 800.00"

  - id: F-R2-04
    invariantes: [INV-19]
    descricao: Ocorrência vinculada a transação sai do cálculo; vencida e não vinculada vai à lista separada.
    entrada:
      hoje: "2026-05-10"
      ocorrencias:
        - {nome: fixo_a, data: "2026-05-05", valor: "400.00", vinculada: false}
        - {nome: fixo_b, data: "2026-05-12", valor: "300.00", vinculada: true}
        - {nome: fixo_c, data: "2026-05-15", valor: "200.00", vinculada: false}
        - {nome: fixo_d, data: "2026-05-25", valor: "999.00", vinculada: false}
    esperado:
      compromissos_fixos: "200.00"
      vencidas_nao_vinculadas: ["fixo_a"]

  # ---- SPEC-010 (ADR 048): recorrentes, vencimento do cartão e limites do horizonte ----

  - id: F-R2-05
    invariantes: [INV-19]
    descricao: >-
      Limites do horizonte (inclusivo): hoje entra, hoje + horizonte entra, hoje + horizonte + 1
      não. A de hoje - 1 é vencida (lista separada) e não entra.
    entrada:
      hoje: "2026-05-10"
      horizonte_dias: 10          # fim = 2026-05-20
      saldos_correntes: "1000.00"
      fixos:                      # recorrentes mensais desde 2026-05, nenhum vinculado
        - {nome: fixo_ontem, data: "2026-05-09", valor: "800.00"}
        - {nome: fixo_hoje, data: "2026-05-10", valor: "100.00"}
        - {nome: fixo_ultimo, data: "2026-05-20", valor: "200.00"}
        - {nome: fixo_depois, data: "2026-05-21", valor: "400.00"}
      receitas:
        - {nome: receita_ultimo, data: "2026-05-20", valor: "50.00"}
        - {nome: receita_depois, data: "2026-05-21", valor: "7000.00"}
    esperado:
      fixos_pendentes: "300.00"       # 100.00 + 200.00
      receitas_pendentes: "50.00"
      disponivel: "1050.00"           # 1000.00 + 50.00
      compromissos: "300.00"
      sobra: "750.00"
      alerta: false
      vencidas_nao_vinculadas: ["fixo_ontem"]

  - id: F-R2-06
    invariantes: [INV-18, INV-31]
    descricao: >-
      Vencimento da competência M com dias vigentes no último dia de M: se vencimento > fechamento,
      vence em M; senão em M+1; dia inexistente usa o último dia do mês; a vigência do vencimento
      vale por competência.
    entrada:
      casos:
        - {fechamento: 10, vencimento: 20, competencia: "2026-05"}
        - {fechamento: 25, vencimento: 5, competencia: "2026-04"}
        - {fechamento: 10, vencimento: 31, competencia: "2026-02"}
        - {fechamento: 31, vencimento: 10, competencia: "2026-12"}
        - {fechamento: 10, vencimento: 10, competencia: "2026-05"}
      vigencias_do_vencimento:
        fechamento: 10
        vencimentos: [{desde: "2026-01-01", dia: 20}, {desde: "2026-06-01", dia: 5}]
        competencias: ["2026-05", "2026-06"]
    esperado:
      vencimentos: ["2026-05-20", "2026-05-05", "2026-02-28", "2027-01-10", "2026-06-10"]
      vencimentos_com_vigencia: ["2026-05-20", "2026-07-05"]
    r2_que_cruza_o_mes:
      # cartão com fechamento 25 e vencimento 5; a competência 2026-04 vence em 2026-05-05
      # (= hoje + horizonte, entra); a 2026-05 vence em 2026-06-05 (fora).
      hoje: "2026-04-25"
      horizonte_dias: 10
      saldos_correntes: "2000.00"
      compras:
        - {data: "2026-03-30", total: "900.00", parcelas: 1}    # competência 2026-04
        - {data: "2026-04-26", total: "500.00", parcelas: 1}    # competência 2026-05
      esperado: {faturas_proprias: "900.00", compromissos: "900.00", sobra: "1100.00"}

  - id: F-R2-07
    invariantes: [INV-18, INV-26]
    descricao: >-
      Fatura com pagamento parcial já feito: o compromisso é a fatura própria menos o pago alocado
      às parcelas próprias (ordem competência, data, parcela; ADR 044). O pago de 450.00 quita a
      parcela de 200.00 da competência 2026-04 e sobra 250.00, que cai na compra própria de
      12/04 (a de terceiro, de 15/04, vem depois e fica sem pago).
    entrada:
      hoje: "2026-05-10"
      horizonte_dias: 10
      saldos_correntes: {snapshot: {data: "2026-01-01", valor: "3000.00"}}
      cartao: {fechamento: 10, vencimento: 20}     # competência 2026-05 vence em 2026-05-20
      compras:
        - {data: "2026-03-20", total: "200.00", parcelas: 1, pessoa: propria}    # 2026-04
        - {data: "2026-04-12", total: "1000.00", parcelas: 1, pessoa: propria}   # 2026-05
        - {data: "2026-04-15", total: "300.00", parcelas: 1, pessoa: pessoa_b}   # 2026-05
      pagamentos: [{data: "2026-04-30", valor: "450.00"}]
    esperado:
      fatura_2026_05: {total: "1300.00", propria: "1000.00", terceiros: "300.00"}
      pago_alocado_proprio: "250.00"
      saldos_correntes: "2550.00"          # 3000.00 - 450.00
      faturas_proprias: "750.00"           # 1000.00 - 250.00
      compromissos: "750.00"
      sobra: "1800.00"                     # 2550.00 - 750.00
      parcial: false                       # fecha em 2026-05-10 = hoje

  - id: F-R2-08
    invariantes: [INV-19]
    descricao: Fatura aberta (hoje antes do fechamento) entra na sobra como parcial.
    entrada:
      hoje: "2026-05-08"
      horizonte_dias: 10                   # fim = 2026-05-18
      saldos_correntes: {snapshot: {data: "2026-01-01", valor: "1000.00"}}
      cartao: {fechamento: 10, vencimento: 15}     # competência 2026-05 vence em 2026-05-15
      compras: [{data: "2026-04-20", total: "600.00", parcelas: 1}]   # competência 2026-05
    esperado: {faturas_proprias: "600.00", compromissos: "600.00", sobra: "400.00", parcial: true}

  - id: F-R2-09
    invariantes: [INV-19]
    descricao: >-
      O horizonte tem vigência: o vigente na data de hoje decide. Dois fixos mensais desde 2026-06,
      saldo corrente zero, horizonte 10 desde 2026-01-01 e 20 desde 2026-06-01.
    entrada:
      saldos_correntes: "0.00"
      parametros: [{desde: "2026-01-01", dias: 10}, {desde: "2026-06-01", dias: 20}]
      fixos:
        - {nome: fixo_a, dia: 5, valor: "100.00"}
        - {nome: fixo_b, dia: 20, valor: "300.00"}
    esperado:
      hoje_2026_05_31: {horizonte_dias: 10, data_fim: "2026-06-10", compromissos: "100.00", sobra: "-100.00", alerta: true}
      hoje_2026_06_01: {horizonte_dias: 20, data_fim: "2026-06-21", compromissos: "400.00", sobra: "-400.00", alerta: true}
      sem_parametro: {horizonte_dias: 10}

  - id: F-R2-10
    invariantes: [INV-19, INV-31]
    descricao: Dia 29 a 31 do recorrente usa o último dia válido do mês (mesma regra do ADR 027).
    entrada:
      mes_inicio: "2026-01"
      recorrentes: [{dia: 29}, {dia: 30}, {dia: 31}]
      meses: ["2026-01", "2026-02", "2026-03", "2026-04", "2028-02"]
    esperado:
      dia_29: ["2026-01-29", "2026-02-28", "2026-03-29", "2026-04-29", "2028-02-29"]
      dia_30: ["2026-01-30", "2026-02-28", "2026-03-30", "2026-04-30", "2028-02-29"]
      dia_31: ["2026-01-31", "2026-02-28", "2026-03-31", "2026-04-30", "2028-02-29"]

  - id: F-R2-11
    invariantes: [INV-19]
    descricao: >-
      Valor da ocorrência = valor esperado até vincular; vinculada (transação com data <= hoje),
      vale o valor da transação e a ocorrência sai do R2. Desvincular devolve o esperado e a
      ocorrência volta ao R2.
    entrada:
      hoje: "2026-05-10"
      horizonte_dias: 10
      saldos_correntes: "0.00"
      recorrente: {tipo: fixo, valor: "500.00", dia: 12, mes_inicio: "2026-05"}
      transacao: {tipo: debito, data: "2026-05-08", valor: "480.00"}    # paga antes do dia 12
    esperado:
      antes: {ocorrencia_2026_05: {data: "2026-05-12", valor: "500.00", vinculada: false}, compromissos: "500.00"}
      vinculada: {ocorrencia_2026_05: {valor: "480.00", vinculada: true}, compromissos: "0.00"}
      desvinculada: {ocorrencia_2026_05: {valor: "500.00", vinculada: false}, compromissos: "500.00"}

  - id: F-R2-12
    invariantes: [INV-18, INV-26]
    descricao: >-
      Pago alocado na ordem competência, data, parcela (ADR 044), sem distinguir própria de
      terceiros: parcela de terceiro ANTERIOR à própria absorve o pago e o compromisso sobe; pago
      que não cobre a competência mais antiga não chega à fatura que vence no horizonte.
      Fechamento 10, vencimento 20, hoje 2026-05-10 (horizonte 10), saldo inicial 3000.00 em
      2026-01-01, pagamento em 2026-04-30. A competência 2026-04 vence em 2026-04-20 (fora).
    entrada:
      hoje: "2026-05-10"
      saldo_inicial: "3000.00"
      compras:
        - {data: "2026-03-12", total: "100.00", pessoa: propria}     # competência 2026-04
        - {data: "2026-04-11", total: "400.00", pessoa: pessoa_b}    # 2026-05, ANTES da própria
        - {data: "2026-04-15", total: "600.00", pessoa: propria}     # 2026-05
      casos:
        - {pagamento: "500.00"}
        - {pagamento: "60.00"}
        - {pagamento: "800.00"}
    esperado:
      caso_1:   # 100.00 (2026-04) + 400.00 (terceiro) = 500.00: nada sobra para a própria
        pago_alocado_proprio: "0.00"
        faturas_proprias: "600.00"
        saldos_correntes: "2500.00"
        sobra: "1900.00"
      caso_2:   # 60.00 não cobre nem a competência mais antiga (100.00)
        pago_alocado_proprio: "0.00"
        faturas_proprias: "600.00"
        saldos_correntes: "2940.00"
        sobra: "2340.00"
      caso_3:   # 100.00 + 400.00 + 300.00 para a própria de 600.00
        pago_alocado_proprio: "300.00"
        faturas_proprias: "300.00"
        saldos_correntes: "2200.00"
        sobra: "1900.00"

  - id: F-R2-13
    invariantes: [INV-18, INV-31]
    descricao: >-
      Vigência retroativa: competência anterior à primeira vigência cadastrada usa a primeira. O
      vencimento (dia 5) é cadastrado com vigente_desde = hoje (2026-05-02), mas a competência
      2026-04 (fechamento 25) vence em 2026-05-05, dentro do horizonte, e pesa na sobra. O mesmo
      vale para o fechamento. Cartão com dívida e sem vencimento nenhum é pendência.
    entrada:
      hoje: "2026-05-02"
      horizonte_dias: 10
      saldo_inicial: "2000.00"
      cartao: {fechamento: {dia: 25, desde: "2026-01-01"}, vencimento: {dia: 5, desde: "2026-05-02"}}
      compras: [{data: "2026-03-30", total: "900.00", parcelas: 1}]    # competência 2026-04
      cartao_so_com_vigencia_futura:
        fechamento: {dia: 15, desde: "2026-06-01"}
        vencimento: {dia: 20, desde: "2026-06-01"}
    esperado:
      vencimento_2026_04: "2026-05-05"
      vencimento_2026_05: "2026-06-05"
      faturas_proprias: "900.00"
      sobra: "1100.00"
      pendencias_vencimento: 0
      cartao_so_com_vigencia_futura: {fechamento_2026_04: "2026-04-15", vencimento_2026_04: "2026-04-20"}

  - id: F-R2-14
    invariantes: [INV-18, INV-19]
    descricao: >-
      Data futura não abate (conservador): pagamento de fatura com data > hoje não entra no pago
      alocado do R2 e fixo vinculado a débito com data > hoje continua pendente. Quando a data
      chega (hoje passa a ser a do pagamento/débito), passa a abater.
    entrada:
      pagamento_futuro:     # cenário de F-R2-07 com o pagamento de 450.00 em 2026-05-15
        compras_e_cartao: F-R2-07
        data_do_pagamento: "2026-05-15"
      vinculo_futuro:
        saldo_inicial: "1000.00"
        recorrente: {tipo: fixo, valor: "500.00", dia: 12, mes_inicio: "2026-05"}
        transacao: {tipo: debito, data: "2026-05-12", valor: "480.00"}
    esperado:
      pagamento_futuro:
        hoje_2026_05_10: {saldos_correntes: "3000.00", faturas_proprias: "1000.00", sobra: "2000.00"}
        hoje_2026_05_15: {saldos_correntes: "2550.00", faturas_proprias: "750.00", sobra: "1800.00"}
      vinculo_futuro:
        hoje_2026_05_10: {fixos_pendentes: "500.00", saldos_correntes: "1000.00", sobra: "500.00"}
        hoje_2026_05_12: {fixos_pendentes: "0.00", saldos_correntes: "520.00", sobra: "520.00"}

  - id: F-R2-15
    invariantes: [INV-19]
    descricao: >-
      Vencidas não vinculadas só olham os últimos 24 meses a partir de hoje (2026-05-10 -> piso
      2024-05-10, inclusive). Recorrente desde 2020-01, nenhuma ocorrência vinculada.
    entrada:
      hoje: "2026-05-10"
      recorrentes: [{dia: 15}, {dia: 5}, {dia: 10}]
    esperado:
      dia_15: {vencidas: 24, primeira: "2024-05-15", ultima: "2026-04-15"}
      dia_5: {vencidas: 24, primeira: "2024-06-05", ultima: "2026-05-05"}     # 2024-05-05 < piso
      dia_10: {vencidas: 24, primeira: "2024-05-10", ultima: "2026-04-10"}    # piso inclusive

  - id: F-VALE-01
    invariantes: [INV-21, INV-22]
    descricao: Alocação por bolso a partir do crédito do mês.
    entrada: {credito_mes: "1000.00", base_trabalho: "200.00"}
    esperado: {trabalho: "200.00", pessoal: "800.00"}

  - id: F-VALE-02
    invariantes: [INV-21, INV-25]
    descricao: Sobra sem estouro.
    entrada:
      credito_mes: "1000.00"
      base_trabalho: "200.00"
      consumo: {trabalho: "150.00", pessoal: "700.00"}
    esperado:
      resta: {trabalho: "50.00", pessoal: "100.00"}
      sobra: "150.00"

  - id: F-VALE-03
    invariantes: [INV-25]
    descricao: Estouro em um bolso não é compensado pela sobra do outro.
    entrada:
      credito_mes: "1000.00"
      base_trabalho: "200.00"
      consumo: {trabalho: "250.00", pessoal: "700.00"}
    esperado:
      resta: {trabalho: "-50.00", pessoal: "100.00"}
      sobra: "100.00"
      alerta_trabalho: true

  - id: F-VALE-04
    invariantes: [INV-21, INV-25]
    descricao: Decisão de destino soma na alocação do mês seguinte; não move saldo; sem decisão, sem ajuste.
    entrada:
      mes_1: {credito: "1000.00", base_trabalho: "200.00", sobra: "150.00", decisao: pessoal}
      mes_2: {credito: "1000.00", base_trabalho: "200.00"}
    esperado:
      alocacao_mes_2: {trabalho: "200.00", pessoal: "950.00"}
      variacao_saldo_pela_decisao: "0.00"
    variante_sem_decisao:
      alocacao_mes_2: {trabalho: "200.00", pessoal: "800.00"}

  - id: F-VALE-05
    invariantes: [INV-22, INV-24]
    descricao: Saldo do vale acumula como saldo derivado normal; receita total = caixa + vale.
    entrada:
      saldo_inicial_snapshot: "100.00"
      credito_mes: "1000.00"
      consumo_total: "850.00"
      receita_caixa: "5000.00"
    esperado:
      saldo_derivado: "250.00"
      receita_total: "6000.00"
      tela_principal_mostra: "5000.00"

  # ---- SPEC-013 (ADR 052): valores calculados à mão. Base de trabalho 200.00 em todas. ----
  - id: F-VALE-06
    invariantes: [INV-21, INV-25]
    descricao: >-
      Crédito menor que a base, crédito igual à base e mês sem crédito. Alocação inicial:
      trabalho = min(base, crédito); pessoal = max(crédito − base, 0). Mês sem crédito (nenhuma
      receita no VR no mês) tem estado sem_credito e não dispara R5, mesmo com resta negativo.
    casos:
      - nome: credito_menor_que_a_base
        entrada: {credito: "150.00", base_trabalho: "200.00", consumo: {trabalho: "100.00", pessoal: "0.00"}}
        esperado:
          estado: ok
          alocacao_inicial: {trabalho: "150.00", pessoal: "0.00"}
          resta: {trabalho: "50.00", pessoal: "0.00"}
          sobra: "50.00"
      - nome: credito_igual_a_base
        entrada: {credito: "200.00", base_trabalho: "200.00", consumo: {trabalho: "0.00", pessoal: "0.00"}}
        esperado:
          estado: ok
          alocacao_inicial: {trabalho: "200.00", pessoal: "0.00"}
          resta: {trabalho: "200.00", pessoal: "0.00"}
          sobra: "200.00"
      - nome: mes_sem_credito
        entrada: {credito: "0.00", base_trabalho: "200.00", consumo: {trabalho: "0.00", pessoal: "30.00"}}
        esperado:
          estado: sem_credito
          alocacao_inicial: {trabalho: "0.00", pessoal: "0.00"}
          resta: {trabalho: "0.00", pessoal: "-30.00"}
          sobra: "0.00"
          r5: false

  - id: F-VALE-07
    invariantes: [INV-21, INV-25]
    descricao: >-
      Encadeamento de quatro meses (2025-01 a 2025-04), crédito 1000.00 em cada um, com decisões
      diferentes. O ajuste de um mês é só a sobra do mês anterior: nada acumula além disso.
      Mês 1: alocação 200/800, consumo 150/700, resta 50/100, sobra 150, decisão pessoal.
      Mês 2: ajuste pessoal +150, alocação 200/950, consumo 200/900, resta 0/50, sobra 50, decisão
      trabalho. Mês 3: ajuste trabalho +50 (a sobra do mês 2, não a do 1), alocação 250/800,
      consumo 260/600, resta −10/200, sobra 200 (o estouro de trabalho não é compensado), decisão
      nenhum. Mês 4: ajuste 0, alocação 200/800, sem consumo, resta 200/800, sobra 1000.
    entrada:
      base_trabalho: "200.00"
      meses:
        "2025-01": {credito: "1000.00", consumo: {trabalho: "150.00", pessoal: "700.00"}, decisao: pessoal}
        "2025-02": {credito: "1000.00", consumo: {trabalho: "200.00", pessoal: "900.00"}, decisao: trabalho}
        "2025-03": {credito: "1000.00", consumo: {trabalho: "260.00", pessoal: "600.00"}, decisao: nenhum}
        "2025-04": {credito: "1000.00", consumo: {trabalho: "0.00", pessoal: "0.00"}}
    esperado:
      "2025-01": {ajuste: {trabalho: "0.00", pessoal: "0.00"}, alocacao: {trabalho: "200.00", pessoal: "800.00"}, resta: {trabalho: "50.00", pessoal: "100.00"}, sobra: "150.00"}
      "2025-02": {ajuste: {trabalho: "0.00", pessoal: "150.00"}, alocacao: {trabalho: "200.00", pessoal: "950.00"}, resta: {trabalho: "0.00", pessoal: "50.00"}, sobra: "50.00"}
      "2025-03": {ajuste: {trabalho: "50.00", pessoal: "0.00"}, alocacao: {trabalho: "250.00", pessoal: "800.00"}, resta: {trabalho: "-10.00", pessoal: "200.00"}, sobra: "200.00"}
      "2025-04": {ajuste: {trabalho: "0.00", pessoal: "0.00"}, alocacao: {trabalho: "200.00", pessoal: "800.00"}, resta: {trabalho: "200.00", pessoal: "800.00"}, sobra: "1000.00"}

  - id: F-VALE-08
    invariantes: [INV-25]
    descricao: >-
      Estouro nos dois bolsos no mês corrente (R5 duplo). Crédito 1000.00, alocação 200/800,
      consumo 250/850: resta −50/−50; sobra 0.00 (nada a compensar). Dois alertas R5, ordenados por
      detalhe (vale_pessoal_estourado antes de vale_trabalho_estourado), severidade alta.
    entrada:
      credito: "1000.00"
      base_trabalho: "200.00"
      consumo: {trabalho: "250.00", pessoal: "850.00"}
    esperado:
      resta: {trabalho: "-50.00", pessoal: "-50.00"}
      sobra: "0.00"
      alertas:
        - {codigo: R5, tipo: alerta, severidade: alta, detalhe: vale_pessoal_estourado, bolso: pessoal, alocacao: "800.00", consumo: "850.00", resta: "-50.00"}
        - {codigo: R5, tipo: alerta, severidade: alta, detalhe: vale_trabalho_estourado, bolso: trabalho, alocacao: "200.00", consumo: "250.00", resta: "-50.00"}

  - id: F-VALE-09
    invariantes: [INV-20, INV-22, INV-24]
    descricao: >-
      Receita total com o VA além do VR, no mês 2025-04. Caixa: receita 5000.00. VR: snapshot
      100.00 em 2025-03-31, receita 1000.00, despesas 850.00 (bolsos 150/700; o total 850 = 150 + 700).
      VA (sem bolsos): snapshot 50.00 em 2025-03-31, receita 400.00, despesa 120.00. Receita de
      benefício = 1000 + 400 = 1400.00; receita total = 5000 + 1400 = 6400.00; a tela principal
      mostra só 5000.00. Saldo VR = 100 + 1000 − 850 = 250.00; saldo VA = 50 + 400 − 120 = 330.00.
      As duas contas ficam fora do gasto real (0.00 sem outras despesas).
    entrada:
      hoje: "2025-04-30"
      receita_caixa: "5000.00"
      vr: {snapshot: "100.00", receita: "1000.00", consumo: {trabalho: "150.00", pessoal: "700.00"}}
      va: {snapshot: "50.00", receita: "400.00", despesa: "120.00"}
    esperado:
      receita_caixa: "5000.00"
      receita_beneficio: "1400.00"
      receita_total: "6400.00"
      saldo_vr: "250.00"
      saldo_va: "330.00"
      gasto_real: "0.00"
      tela_principal_mostra: "5000.00"

  - id: F-VALE-10
    invariantes: [INV-25]
    descricao: >-
      Decisão substituída. Mês 2025-01: crédito 1000.00, consumo 150/700, sobra 150.00. O mês 2025-02
      tem crédito 1000.00. Decisões sucessivas sobre 2025-01: pessoal (versão 1), trabalho (versão 2),
      nenhum (versão 3). A alocação efetiva de 2025-02 segue só a vigente: após a 1ª, 200/950; após
      a 2ª, 350/800; após a 3ª, 200/800. O histórico guarda as 3 versões; a vigente é a 3 (nenhum).
      O saldo derivado do VR é o mesmo antes e depois de cada decisão (variação 0.00).
    entrada:
      base_trabalho: "200.00"
      mes_1: {credito: "1000.00", consumo: {trabalho: "150.00", pessoal: "700.00"}}
      mes_2: {credito: "1000.00"}
      decisoes_sobre_mes_1: [pessoal, trabalho, nenhum]
    esperado:
      sobra_mes_1: "150.00"
      alocacao_mes_2: [{trabalho: "200.00", pessoal: "950.00"}, {trabalho: "350.00", pessoal: "800.00"}, {trabalho: "200.00", pessoal: "800.00"}]
      versoes: 3
      variacao_saldo_por_decisao: "0.00"

  - id: F-VALE-11
    invariantes: [INV-25]
    descricao: >-
      Mês corrente x encerrado, base 200.00. 2025-05: crédito 1000.00, consumo 250/700, resta
      −50/100, sobra 100.00. 2025-06: crédito 1000.00, consumo 220/0, alocação 200/800, resta
      −20/800, sobra 800.00. 2025-07: nenhuma receita (sem crédito), sem consumo. R5 olha só o mês
      corrente de hoje. Hoje 2025-05-20: alerta de trabalho (−50.00); mês 2025-05 não encerrado. Hoje
      2025-06-15: alerta de trabalho (−20.00) do mês 2025-06; o estouro de 2025-05 não alerta mais
      (mês encerrado). Hoje 2025-07-05: nenhum alerta (sem crédito; o estouro de junho é passado).
      Só se decide a sobra de mês encerrado: o mês civil atual e os futuros são recusados.
    entrada:
      base_trabalho: "200.00"
      meses:
        "2025-05": {credito: "1000.00", consumo: {trabalho: "250.00", pessoal: "700.00"}}
        "2025-06": {credito: "1000.00", consumo: {trabalho: "220.00", pessoal: "0.00"}}
    esperado:
      "hoje_2025-05-20": {alertas: [{detalhe: vale_trabalho_estourado, resta: "-50.00"}], mes_encerrado: false}
      "hoje_2025-06-15": {alertas: [{detalhe: vale_trabalho_estourado, resta: "-20.00"}], mes_encerrado_2025_05: true}
      "hoje_2025-07-05": {alertas: []}

  - id: F-VALE-12
    invariantes: [INV-21, INV-25]
    descricao: >-
      Conta de benefício com histórico que vira VR (ADR 052, bolso antes de marcar). Base 200.00.
      Caso 1: nenhum VR marcado; em 2025-05 a conta recebe 1000.00 (dia 5) e tem as despesas
      250.00 (dia 10) e 700.00 (dia 11), lançadas sem bolso. Marcá-la como VR desde 2025-05-01 é
      recusado (duas despesas sem bolso). Como não há VR marcado, as despesas aceitam bolso:
      250.00 trabalho e 700.00 pessoal; agora a marcação passa. Alocação 200/800, consumo
      250/700, resta −50/100, sobra 100.00; R5 de trabalho (−50.00) com hoje 2025-05-20.
      Caso 2 (vigências intercaladas): a conta B é o VR desde 2025-03-01. A conta A tem uma despesa
      em 2025-02-10 (sem VR então) e outra em 2025-06-10 (B é o VR), ambas sem bolso. Marcar A
      como VR desde 2025-02-01 é recusado só por causa de fevereiro; depois de dar o bolso
      trabalho à despesa de fevereiro (30.00) a marcação passa, e a de junho (mês em que B é o VR)
      não conta. Fevereiro: conta A, consumo 30.00/0.00; março em diante: conta B.
    caso_1:
      base_trabalho: "200.00"
      credito: "1000.00"
      despesas: [{valor: "250.00", bolso: trabalho}, {valor: "700.00", bolso: pessoal}]
      esperado:
        consumo: {trabalho: "250.00", pessoal: "700.00"}
        alocacao: {trabalho: "200.00", pessoal: "800.00"}
        resta: {trabalho: "-50.00", pessoal: "100.00"}
        sobra: "100.00"
        r5_trabalho: "-50.00"
    caso_2:
      despesa_fev: {valor: "30.00", bolso: trabalho}
      despesa_jun: {valor: "40.00"}
      esperado:
        fev: {conta: A, consumo: {trabalho: "30.00", pessoal: "0.00"}}
        mar: {conta: B}

  - id: F-REND-01
    invariantes: [INV-36, INV-04]
    descricao: >-
      Rendimento registra bruto e imposto retido; a conta recebe bruto − imposto e nada disso é
      gasto real.
    entrada:
      snapshot: {data: "2026-03-01", valor: "1000.00"}
      rendimento: {data: "2026-03-10", bruto: "100.00", imposto: "22.50"}
    esperado:
      creditado: "77.50"
      saldo_derivado: "1077.50"
      gasto_real: "0.00"

  # ---- SPEC-005 (ADR 043): fechamento, parcelas, fatura, limite e pagamento ----

  - id: F-FECH-01
    invariantes: [INV-31]
    descricao: Fechamento cadastrado em dia inexistente no mês usa o último dia válido.
    entrada:
      dia_fechamento: 31
      meses: ["2026-01", "2026-02", "2026-04", "2028-02"]
    esperado:
      fechamento_efetivo: ["2026-01-31", "2026-02-28", "2026-04-30", "2028-02-29"]

  - id: F-FECH-02
    invariantes: [INV-07, INV-31]
    descricao: >-
      Competência = mês do fechamento. Compra antes do dia do fechamento entra na fatura que fecha;
      no dia do fechamento ou depois, entra na seguinte (ADR 043, decisão 1). Inclui o dia
      inexistente (fechamento 31 vira 28 em fevereiro de 2026).
    entrada:
      cartao: {dia_fechamento: 10}
      compras:
        - {data: "2026-03-09", total: "10.00", parcelas: 1}
        - {data: "2026-03-10", total: "10.00", parcelas: 1}
        - {data: "2026-03-11", total: "10.00", parcelas: 1}
        - {data: "2026-12-10", total: "10.00", parcelas: 1}
      cartao_dia_31:
        dia_fechamento: 31
        compras:
          - {data: "2026-02-27", total: "10.00", parcelas: 1}
          - {data: "2026-02-28", total: "10.00", parcelas: 1}
    esperado:
      competencias: ["2026-03", "2026-04", "2026-04", "2027-01"]
      competencias_dia_31: ["2026-02", "2026-03"]

  - id: F-FECH-03
    invariantes: [INV-07, INV-31]
    descricao: >-
      O dia de fechamento usado é o vigente na data da compra; mudar o fechamento não recalcula
      compras já feitas (ADR 043, decisão 5).
    entrada:
      vigencias: [{desde: "2026-01-01", dia: 10}, {desde: "2026-04-01", dia: 20}]
      compras:
        - {data: "2026-03-15", total: "10.00", parcelas: 1}
        - {data: "2026-04-15", total: "10.00", parcelas: 1}
        - {data: "2026-04-20", total: "10.00", parcelas: 1}
    esperado:
      competencias: ["2026-04", "2026-04", "2026-05"]

  - id: F-PARC-03
    invariantes: [INV-02, INV-07]
    descricao: >-
      Parcelamento que cruza o ano, à vista (1 parcela), divisão exata e resto de centavos.
      Fechamento dia 10; compra em 15/11/2026 cai na competência 2026-12.
    entrada:
      cartao: {dia_fechamento: 10}
      casos:
        - {data: "2026-11-15", total: "300.00", parcelas: 3}
        - {data: "2026-11-15", total: "50.00", parcelas: 1}
        - {data: "2026-11-15", total: "0.10", parcelas: 3}
    esperado:
      caso_1: {parcelas: ["100.00", "100.00", "100.00"], competencias: ["2026-12", "2027-01", "2027-02"], soma: "300.00"}
      caso_2: {parcelas: ["50.00"], competencias: ["2026-12"], soma: "50.00"}
      caso_3: {parcelas: ["0.03", "0.03", "0.04"], competencias: ["2026-12", "2027-01", "2027-02"], soma: "0.10"}

  - id: F-FAT-02
    invariantes: [INV-07, INV-26]
    descricao: >-
      Total da fatura = soma das parcelas da competência, de compras diferentes. Sem terceiros
      (terceiros entram na SPEC-013; F-FAT-01 cobre própria + terceiros).
    entrada:
      cartao: {dia_fechamento: 10}
      compras:
        - {data: "2026-03-05", total: "600.00", parcelas: 3}
        - {data: "2026-03-15", total: "100.00", parcelas: 1}
    esperado:
      faturas:
        "2026-03": "200.00"
        "2026-04": "300.00"
        "2026-05": "200.00"

  - id: F-LIM-02
    invariantes: [INV-06]
    descricao: >-
      Linha de crédito compartilhada por dois cartões. Limite usado = dívida acumulada (total das
      compras, com parcelas futuras) menos pagamentos; pagamento parcial devolve limite; o
      disponível pode ficar negativo e nada é bloqueado.
    entrada:
      linha: {limite: "5000.00"}
      compras:
        - {cartao: X, total: "1200.00", parcelas: 4}
        - {cartao: Y, total: "300.00", parcelas: 1}
      pagamentos:
        - {cartao: X, valor: "500.00"}
      linha_pequena: {limite: "1000.00", compras: [{cartao: X, total: "1200.00", parcelas: 4}]}
    esperado:
      antes_do_pagamento: {limite_usado: "1500.00", limite_disponivel: "3500.00"}
      depois_do_pagamento: {limite_usado: "1000.00", limite_disponivel: "4000.00"}
      saldo_cartao_x: "-700.00"
      saldo_cartao_y: "-300.00"
      linha_pequena: {limite_usado: "1200.00", limite_disponivel: "-200.00"}

  - id: F-PAG-01
    invariantes: [INV-01, INV-04, INV-05]
    descricao: >-
      Pagamento de fatura é transferência da conta corrente para o cartão, pode ser parcial, abate
      a dívida e não é gasto real (a compra é o gasto, na competência).
    entrada:
      corrente: {snapshot: {data: "2026-03-01", valor: "1000.00"}}
      compra_cartao: {data: "2026-03-05", total: "400.00", parcelas: 1}
      pagamento: {data: "2026-03-20", valor: "150.00", de: corrente, para: cartao}
    esperado:
      pernas: ["-150.00", "150.00"]
      soma_pernas: "0.00"
      saldo_corrente: "850.00"
      saldo_cartao: "-250.00"
      limite_usado: "250.00"
      gasto_real_do_pagamento: "0.00"

  - id: F-REP-01
    invariantes: [INV-10, INV-12, INV-33]
    descricao: >-
      Repasse acima da dívida (ADR 045). D = soma do total das compras de terceiro da pessoa; R =
      soma dos repasses. a_receber = max(D - R, 0) e credito_da_pessoa = max(R - D, 0); nunca
      negativo. Uma compra futura da pessoa abate o crédito sozinha. Repasse sobe o saldo da conta
      corrente e não é receita nem gasto.
    entrada:
      pessoa: pessoa_b
      passos:
        - {compra: {total: "400.00", parcelas: 1}}
        - {repasse: "250.00"}
        - {repasse: "200.00"}
        - {compra: {total: "30.00", parcelas: 1}}
        - {compra: {total: "100.00", parcelas: 1}}
    esperado:
      apos_compra_400: {divida: "400.00", repassado: "0.00", a_receber: "400.00", credito_da_pessoa: "0.00"}
      apos_repasse_250: {divida: "400.00", repassado: "250.00", a_receber: "150.00", credito_da_pessoa: "0.00"}
      apos_repasse_200: {divida: "400.00", repassado: "450.00", a_receber: "0.00", credito_da_pessoa: "50.00"}
      apos_compra_30: {divida: "430.00", repassado: "450.00", a_receber: "0.00", credito_da_pessoa: "20.00"}
      apos_compra_100: {divida: "530.00", repassado: "450.00", a_receber: "80.00", credito_da_pessoa: "0.00"}
      saldo_corrente_apos_dois_repasses: "450.00"

  - id: F-REP-02
    invariantes: [INV-08, INV-10, INV-26, INV-33]
    descricao: >-
      Estorno de compra de terceiro (ADR 045 itens 6 e 8, ADR 044). Fechamento dia 10; compra de
      400,00 em 4 parcelas de 100,00 da pessoa_b nas competências c1..c4 (compra antes do dia 10);
      compra própria de 50,00 à vista em c3; repasse de 100,00; pagamento de 150,00 do cartão
      (aloca c1 100,00 e c2 50,00, logo P = 150,00 e N = 250,00); estorno no mês de c2 depois do
      fechamento, cujo crédito cai em c3. D cai pelo T inteiro (400,00); o excedente do repasse vira
      crédito da pessoa. O crédito P fica no grupo da compra (terceiros); faturas anteriores a c3 não
      mudam e a própria não é reduzida.
    entrada:
      cartao: {dia_fechamento: 10}
      compra_terceiro: {pessoa: pessoa_b, total: "400.00", parcelas: 4}
      compra_propria: {total: "50.00", parcelas: 1, competencia: c3}
      repasse: "100.00"
      pagamento: "150.00"
      estorno: integral_da_compra_de_terceiro
    esperado:
      antes_do_estorno: {divida: "400.00", repassado: "100.00", a_receber: "300.00", credito_da_pessoa: "0.00"}
      depois_do_estorno: {divida: "0.00", repassado: "100.00", a_receber: "0.00", credito_da_pessoa: "100.00"}
      pago_alocado: "150.00"
      limite_devolvido: "250.00"
      credito_na_fatura: "150.00"
      faturas:
        c1: {total: "100.00", propria: "0.00", terceiros: "100.00"}
        c2: {total: "100.00", propria: "0.00", terceiros: "100.00"}
        c3: {total: "-100.00", propria: "50.00", terceiros: "-150.00"}
        c4: {total: "0.00", propria: "0.00", terceiros: "0.00"}

  - id: F-REP-03
    invariantes: [INV-06, INV-10, INV-11, INV-26, INV-33]
    descricao: >-
      A receber com mais de uma pessoa, fatura própria + terceiros e limite com terceiros. Todas as
      compras no mesmo dia e cartão (primeira parcela em c1, fechamento dia 10). pessoa_c parcela
      90,00 em 3 de 30,00; pessoa_d só repassou (crédito); pessoa_e quitou; pessoa_f cadastrada sem
      movimento.
    entrada:
      linha: {limite: "5000.00"}
      compras:
        - {pessoa: propria, total: "600.00", parcelas: 1}
        - {pessoa: pessoa_b, total: "400.00", parcelas: 1}
        - {pessoa: pessoa_c, total: "90.00", parcelas: 3}
        - {pessoa: pessoa_e, total: "60.00", parcelas: 1}
      repasses:
        - {pessoa: pessoa_b, valor: "250.00"}
        - {pessoa: pessoa_d, valor: "40.00"}
        - {pessoa: pessoa_e, valor: "60.00"}
    esperado:
      pessoa_b: {divida: "400.00", repassado: "250.00", a_receber: "150.00", credito_da_pessoa: "0.00"}
      pessoa_c: {divida: "90.00", repassado: "0.00", a_receber: "90.00", credito_da_pessoa: "0.00"}
      pessoa_d: {divida: "0.00", repassado: "40.00", a_receber: "0.00", credito_da_pessoa: "40.00"}
      pessoa_e: {divida: "60.00", repassado: "60.00", a_receber: "0.00", credito_da_pessoa: "0.00"}
      pessoa_f: {divida: "0.00", repassado: "0.00", a_receber: "0.00", credito_da_pessoa: "0.00"}
      soma_a_receber: "240.00"
      soma_credito_da_pessoa: "40.00"
      fatura_c1: {total: "1090.00", propria: "600.00", terceiros: "490.00"}
      fatura_c2: {total: "30.00", propria: "0.00", terceiros: "30.00"}
      limite_usado: "1150.00"
      limite_disponivel: "3850.00"

  - id: F-REP-04
    invariantes: [INV-32]
    descricao: >-
      Compra dividida entre próprio e terceiro é rejeitada (ADR 030, ADR 045 item 1): 60,00 própria
      + 40,00 da pessoa_b numa compra de 100,00 não existe. Só são aceitas as compras inteiras, 100%
      própria ou 100% de uma pessoa. Terceiro também não vale fora do cartão.
    entrada:
      tentativas_recusadas:
        - {divisao: [{pessoa: propria, valor: "60.00"}, {pessoa: pessoa_b, valor: "40.00"}]}
        - {tipo: debito, total: "100.00", pessoa: pessoa_b}
      aceitas:
        - {tipo: credito, total: "100.00", parcelas: 1, pessoa: pessoa_b}
    esperado:
      lancamentos_gravados_pelas_recusadas: 0
      pessoa_b: {divida: "100.00", repassado: "0.00", a_receber: "100.00", credito_da_pessoa: "0.00"}

  - id: F-GASTO-02
    invariantes: [INV-04, INV-05, INV-11, INV-20, INV-24]
    descricao: >-
      Mês misto (ADR 046): parcelas de compras diferentes na competência, débito em conta de
      reserva (conta como gasto), rendimento com imposto, repasse, transferência, investimento,
      pagamento de fatura, terceiro e conta de benefício fora do gasto; receita de caixa separada
      da de benefício. Cartão fecha no dia 10: compra até o dia 9 cai na competência do mês,
      do dia 10 em diante, na seguinte. Contas: corrente, reserva (da corrente), investimento,
      vale (benefício), cartão.
    entrada:
      compras:
        - {id: A, data: "2025-03-05", total: "300.00", parcelas: 3, pessoa: propria}   # 100 em 03, 04, 05
        - {id: B, data: "2025-03-12", total: "200.00", parcelas: 2, pessoa: propria}   # 100 em 04, 05
        - {id: C, data: "2025-04-05", total: "90.00", parcelas: 1, pessoa: pessoa_b}   # 90 em 04, terceiro
      lancamentos:
        - {data: "2025-03-31", tipo: debito, conta: corrente, valor: "15.00"}
        - {data: "2025-04-08", tipo: debito, conta: corrente, valor: "60.00"}
        - {data: "2025-04-09", tipo: debito, conta: reserva, valor: "25.00"}
        - {data: "2025-04-10", tipo: debito, conta: vale, valor: "40.00"}
        - {data: "2025-05-01", tipo: debito, conta: corrente, valor: "11.00"}
        - {data: "2025-04-15", tipo: rendimento, conta: reserva, bruto: "10.00", imposto: "2.00"}
        - {data: "2025-04-16", tipo: transferencia, de: corrente, para: reserva, valor: "70.00"}
        - {data: "2025-04-17", tipo: investimento, de: corrente, para: investimento, valor: "80.00"}
        - {data: "2025-04-18", tipo: pagamento_fatura, de: corrente, para: cartao, valor: "150.00"}
        - {data: "2025-04-19", tipo: repasse, conta: corrente, valor: "30.00", pessoa: pessoa_b}
        - {data: "2025-03-20", tipo: receita, conta: corrente, valor: "500.00"}
        - {data: "2025-04-02", tipo: receita, conta: corrente, valor: "1000.00"}
        - {data: "2025-04-20", tipo: receita, conta: corrente, valor: "250.00"}
        - {data: "2025-04-05", tipo: receita, conta: vale, valor: "400.00"}
    esperado:
      # abril: parcela 2/3 de A (100) + parcela 1/2 de B (100) + débito corrente (60) + débito
      # reserva (25); C é de terceiro (90), o débito do vale (40) e o resto não são gasto
      gasto_real_2025_04: "285.00"
      # março: parcela 1/3 de A (100) + débito de 15
      gasto_real_2025_03: "115.00"
      # maio: parcela 3/3 de A (100) + parcela 2/2 de B (100) + débito de 11
      gasto_real_2025_05: "211.00"
      gasto_real_2025_06: "0.00"
      gasto_por_conta_2025_04: {corrente: "60.00", reserva: "25.00", cartao: "200.00"}
      receita_caixa_2025_04: "1250.00"
      receita_beneficio_2025_04: "400.00"
      receita_total_2025_04: "1650.00"
      receita_caixa_2025_03: "500.00"

  - id: F-GASTO-03
    invariantes: [INV-04, INV-08, INV-11]
    descricao: >-
      Estorno de compra parcelada que cruza competências (ADR 044 item 5, ADR 046): depois do
      estorno a compra sai do gasto real em TODAS as competências originais, inclusive as já
      fechadas; o crédito do estorno não é receita nem redutor extra do gasto. Fechamento dia 10;
      compra X em 2025-03-05 (400,00 em 4x: 100 em 03, 04, 05, 06), compra Y em 2025-03-06
      (60,00 em 1x: 60 em 03), débito de 20 em 2025-03-15 e de 30 em 2025-04-08; pagamento de
      150,00 do cartão em 2025-04-15; estorno de X em 2025-04-20; receita de 1000,00 em 2025-04-02.
    entrada:
      compra_estornada: {id: X, data: "2025-03-05", total: "400.00", parcelas: 4}
    esperado:
      antes_do_estorno:
        gasto_real_2025_03: "180.00"
        gasto_real_2025_04: "130.00"
        gasto_real_2025_05: "100.00"
        gasto_real_2025_06: "100.00"
      depois_do_estorno:
        gasto_real_2025_03: "80.00"
        gasto_real_2025_04: "30.00"
        gasto_real_2025_05: "0.00"
        gasto_real_2025_06: "0.00"
        receita_caixa_2025_04: "1000.00"

  # ---- SPEC-011 (ADR 049): alertas R1, R2 e R4, derivados na hora (contas à mão) ----

  - id: F-ALERTA-01
    invariantes: [INV-12, INV-17, INV-38]
    descricao: >-
      R1 por nível da reserva (meta 12000.00 = 3 x 4000.00, como F-RES-01): crítica é alerta
      forte (severidade alta), atenção é aviso (media), saudável não gera alerta. Gasto essencial
      ausente ou zero não é R1: gera só o item de configuração (tipo configuracao, severidade
      baixa).
    entrada:
      hoje: "2026-04-01"
      parametro: {desde: "2026-01-01", meses: 3, gasto_essencial: "4000.00"}
    casos:
      - {saldo: "3000.00", alerta: {codigo: R1, tipo: alerta, severidade: alta, detalhe: reserva_critica, nivel: critica, falta: "9000.00", cobertura_meses: "0.75"}}
      - {saldo: "5999.99", alerta: {codigo: R1, tipo: alerta, severidade: alta, detalhe: reserva_critica, nivel: critica, falta: "6000.01", cobertura_meses: "1.50"}}
      - {saldo: "6000.00", alerta: {codigo: R1, tipo: aviso, severidade: media, detalhe: reserva_atencao, nivel: atencao, falta: "6000.00", cobertura_meses: "1.50"}}
      - {saldo: "11999.99", alerta: {codigo: R1, tipo: aviso, severidade: media, detalhe: reserva_atencao, nivel: atencao, falta: "0.01", cobertura_meses: "3.00"}}
      - {saldo: "12000.00", alerta: null}
      - {saldo: "20000.00", alerta: null}
    config_pendente:
      casos: [sem_parametro, gasto_essencial_zero]
      saldo: "3000.00"
      esperado: {codigo: CONFIG, tipo: configuracao, severidade: baixa, detalhe: reserva_gasto_essencial, r1: null}

  - id: F-ALERTA-02
    invariantes: [INV-18, INV-19, INV-38]
    descricao: >-
      R2: alerta forte (severidade alta) só com sobra < 0 estrito; sobra zero ou positiva não
      alerta. Cartão com dívida sem vencimento torna a sobra não confiável (aviso media se a
      sobra é >= 0; o flag também vem na sobra negativa). Ocorrência vencida sem vínculo é aviso
      baixa com a quantidade. Base: hoje 2026-05-10, horizonte 10, corrente com saldo 5000.00 em
      snapshot de 2026-01-01, receita recorrente de 3000.00 no dia 12 (pendente) e um fixo
      recorrente no dia 15 (valor abaixo). Disponível = 8000.00.
    entrada:
      hoje: "2026-05-10"
      horizonte_dias: 10
      saldos_correntes: "5000.00"
      receita_recorrente_pendente: "3000.00"
    casos:
      - {fixo: "7999.99", sobra: "0.01", alerta: null}
      - {fixo: "8000.00", sobra: "0.00", alerta: null}
      - {fixo: "8000.01", sobra: "-0.01", alerta: {codigo: R2, tipo: alerta, severidade: alta, detalhe: sobra_negativa, sobra_nao_confiavel: false}}
      # cartão com dívida de 300.00 (compra em 2026-04-20), fechamento cadastrado e SEM vencimento
      - {fixo: "2500.00", cartao_sem_vencimento: true, sobra: "5500.00", pendencias_vencimento: 1, alerta: {codigo: R2, tipo: aviso, severidade: media, detalhe: sobra_nao_confiavel, sobra_nao_confiavel: true}}
      - {fixo: "9000.00", cartao_sem_vencimento: true, sobra: "-1000.00", pendencias_vencimento: 1, alerta: {codigo: R2, tipo: alerta, severidade: alta, detalhe: sobra_negativa, sobra_nao_confiavel: true}}
    vencida:
      # fixo de 400.00 no dia 5 de 2026-05, sem vínculo: sai da sobra (8000.00) e vira aviso à parte
      fixo: {valor: "400.00", dia: 5, inicio: "2026-05"}
      esperado: {sobra: "8000.00", vencidas: 1, alerta: {codigo: R2, tipo: aviso, severidade: baixa, detalhe: vencidas}}

  - id: F-ALERTA-03
    invariantes: [INV-23, INV-30, INV-38]
    descricao: >-
      R4 no alerta: uma linha por conta vigente com o snapshot divergente mais recente até hoje e
      a quantidade de snapshots divergentes dela. Divergência = derivado - snapshot (ADR 041).
      Cartão = conta de dívida. Snapshot com data posterior a hoje e conta excluída não geram
      alerta. Hoje = 2026-05-10.
    casos:
      - nome: conta_a   # F-SALDO-01
        snapshots: [{data: "2026-01-10", valor: "1000.00"}, {data: "2026-01-14", valor: "1040.00"}]
        transacoes: [{data: "2026-01-11", valor: "-50.00"}, {data: "2026-01-12", valor: "200.00"}, {data: "2026-01-13", valor: "-100.00"}]
        esperado: {data_snapshot: "2026-01-14", valor_snapshot: "1040.00", saldo_derivado: "1050.00", divergencia: "10.00", quantidade: 1}
      - nome: cartao    # dívida: -500.00, compra de 100.00 em 03-05, snapshot -550.00
        snapshots: [{data: "2026-03-01", valor: "-500.00"}, {data: "2026-03-10", valor: "-550.00"}]
        compra: {data: "2026-03-05", total: "100.00", parcelas: 1}
        esperado: {data_snapshot: "2026-03-10", valor_snapshot: "-550.00", saldo_derivado: "-600.00", divergencia: "-50.00", quantidade: 1}
      - nome: conta_duas   # duas divergências: em 01-14 (900.00 - 950.00 = -50.00) e em 01-20 (930.00 - 900.00 = 30.00)
        snapshots: [{data: "2026-01-10", valor: "1000.00"}, {data: "2026-01-14", valor: "950.00"}, {data: "2026-01-20", valor: "900.00"}]
        transacoes: [{data: "2026-01-11", valor: "-100.00"}, {data: "2026-01-15", valor: "-20.00"}]
        esperado: {data_snapshot: "2026-01-20", valor_snapshot: "900.00", saldo_derivado: "930.00", divergencia: "30.00", quantidade: 2}
      - nome: conta_futura   # a divergência está em 2026-06-01, depois de hoje
        snapshots: [{data: "2026-01-10", valor: "100.00"}, {data: "2026-06-01", valor: "90.00"}]
        esperado: null
      - nome: conta_conferida   # derivado = snapshot
        snapshots: [{data: "2026-01-10", valor: "500.00"}, {data: "2026-01-14", valor: "400.00"}]
        transacoes: [{data: "2026-01-12", valor: "-100.00"}]
        esperado: null

  - id: F-ALERTA-04
    invariantes: [INV-38]
    descricao: >-
      Vários alertas juntos, ordenados por severidade (alta, media, baixa), depois por código.
      Hoje 2026-05-10, horizonte 10. Reserva "caixinha" com snapshot de 8000.00 em 2026-01-01 e
      parâmetro (3 meses, gasto essencial 4000.00): meta 12000.00, nível atenção. A corrente-mãe
      dela tem saldo 0.00, um fixo de 100.00 no dia 15 (pendente) e um fixo de 50.00 no dia 5
      (vencido, sem vínculo): disponível 0.00, compromissos 100.00, sobra -100.00. Uma conta de
      investimento com snapshot 1000.00 (01-10), débito de 50.00 (01-11) e snapshot 1000.00
      (01-14): derivado 950.00, divergência -50.00 (a conta de investimento não entra no R2).
    esperado:
      ordem:
        - {codigo: R2, tipo: alerta, severidade: alta, detalhe: sobra_negativa, sobra: "-100.00"}
        - {codigo: R1, tipo: aviso, severidade: media, detalhe: reserva_atencao, nivel: atencao, falta: "4000.00"}
        - {codigo: R4, tipo: aviso, severidade: media, detalhe: divergencia_saldo, divergencia: "-50.00"}
        - {codigo: R2, tipo: aviso, severidade: baixa, detalhe: vencidas, vencidas: 1}
    sem_alertas:
      descricao: usuário novo sem nada informado devolve só o item de configuração da reserva
      esperado: [{codigo: CONFIG, tipo: configuracao, severidade: baixa}]

  - id: F-ALERTA-05
    invariantes: [INV-12, INV-17, INV-38]
    descricao: >-
      Sem nenhuma conta de reserva mas com gasto essencial configurado (4000.00, 3 meses): a
      meta existe (12000.00) e o saldo é 0.00, então o nível é crítica e o R1 é alerta forte
      (ADR 049 item 3). Cobertura 0 / 4000 = 0.00; falta = meta.
    entrada:
      hoje: "2026-04-01"
      contas_reserva: 0
      parametro: {desde: "2026-01-01", meses: 3, gasto_essencial: "4000.00"}
    esperado:
      alerta: {codigo: R1, tipo: alerta, severidade: alta, detalhe: reserva_critica, nivel: critica, saldo_liquido: "0.00", meta: "12000.00", falta: "12000.00", cobertura_meses: "0.00"}
