# Critérios de aceite das SPECs, com ID estável (ex.: SPEC-003-AC-2).
# Vazio até cada SPEC ser escrita. Cada critério deve ter ao menos um teste.
#
# Esquema de cada item:
#   - id: SPEC-NNN-AC-N
#     spec: SPEC-NNN
#     dado: "..."
#     quando: "..."
#     entao: "..."
#     invariantes: [INV-XX]     # opcional
#     fixtures: [F-XXX-NN]      # opcional
#     teste: []                 # caminhos/ids de teste (preenchido na implementação)
versao: 1
criterios:
  - id: SPEC-001-AC-1
    spec: SPEC-001
    dado: "uma sessão de testes apontando para um banco que não é o tst"
    quando: "a suíte inicia"
    entao: "a suíte aborta antes de qualquer teste"
    invariantes: []
    teste: ["tests/db/test_guarda_tst.py::test_aborta_fora_de_tst"]
  - id: SPEC-001-AC-2
    spec: SPEC-001
    dado: "o contêiner do Postgres do projeto no ar"
    quando: "se tenta conectar por interfaces não loopback"
    entao: "somente 127.0.0.1:5433 responde"
    invariantes: []
    teste: ["tests/db/test_rede.py::test_escuta_apenas_localhost"]
  - id: SPEC-001-AC-3
    spec: SPEC-001
    dado: "um tst limpo"
    quando: "as migrações são aplicadas e revertidas"
    entao: "aplicam e revertem sem erro"
    invariantes: []
    teste: ["tests/db/test_migracoes.py::test_aplica_e_reverte"]
  - id: SPEC-001-AC-4
    spec: SPEC-001
    dado: "o comando único check"
    quando: "qualquer etapa (lint, tipos, testes, contratos, rastreabilidade) falha"
    entao: "o check termina com código diferente de zero"
    invariantes: []
    teste: ["tests/test_check.py::test_check_falha_quando_etapa_falha"]
  - id: SPEC-001-AC-5
    spec: SPEC-001
    dado: "invariantes e critérios com e sem teste"
    quando: "o script de rastreabilidade roda"
    entao: "lista os sem teste e retorna vazio quando tudo tem teste"
    invariantes: []
    teste: ["tests/test_rastreabilidade.py::test_lista_sem_teste"]
  - id: SPEC-001-AC-6
    spec: SPEC-001
    dado: "o workflow de CI"
    quando: "roda no primeiro push, sem segredos"
    entao: "o job check executa o check completo e fica verde"
    invariantes: []
    teste: []
    waiver: "humano: job check verde no primeiro run do CI, https://github.com/jotap-rocha/abako/actions/runs/41051543297/job/124048547371"
  - id: SPEC-001-AC-7
    spec: SPEC-001
    dado: "o esquema base migrado em tst"
    quando: "se listam as tabelas do ledger"
    entao: "toda tabela (exceto a de controle do Alembic) tem user_id"
    invariantes: [INV-13]
    teste: ["tests/db/test_esquema.py::test_toda_tabela_tem_user_id"]
  - id: SPEC-001-AC-8
    spec: SPEC-001
    dado: "uma entidade versionada com uma versão vigente"
    quando: "se insere uma segunda versão vigente da mesma entidade"
    entao: "a inserção falha por violação de unicidade"
    invariantes: [INV-27]
    teste: ["tests/db/test_versao_vigente.py::test_segunda_vigente_falha"]
  - id: SPEC-001-AC-9
    spec: SPEC-001
    dado: "conexão com o papel da aplicação"
    quando: "se tenta UPDATE ou DELETE nas tabelas de versão"
    entao: "o banco nega (a aplicação só tem SELECT e INSERT)"
    invariantes: []
    teste:
      - "tests/db/test_papeis.py::test_app_sem_update_delete"
      - "tests/db/test_papeis.py::test_pipeline_somente_leitura"
  - id: SPEC-001-AC-10
    spec: SPEC-001
    dado: "o esquema base migrado"
    quando: "se inspecionam os tipos das colunas"
    entao: "nenhuma coluna monetária usa ponto flutuante; valor é NUMERIC"
    invariantes: [INV-14]
    teste: ["tests/db/test_esquema.py::test_dinheiro_numeric"]
  - id: SPEC-001-AC-11
    spec: SPEC-001
    dado: "o esquema base migrado"
    quando: "se repete a mesma chave de idempotência para o mesmo usuário"
    entao: "a segunda falha; existe campo de versão; a chave se repete só entre usuários"
    invariantes: []
    teste:
      - "tests/db/test_idempotencia_esquema.py::test_chave_unica_por_usuario"
      - "tests/db/test_idempotencia_esquema.py::test_campo_de_versao_existe"
  - id: SPEC-001-AC-12
    spec: SPEC-001
    dado: "o script de restauração"
    quando: "o alvo é prd (ou qualquer banco que não seja o descartável restauracao)"
    entao: "recusa antes de ler .env, chamar processo externo ou conectar"
    invariantes: []
    teste: ["tests/db/test_restore.py::test_recusa_alvo_prd"]
  - id: SPEC-001-AC-13
    spec: SPEC-001
    dado: "um backup do tst sintético com par de chaves age efêmero"
    quando: "o script de backup roda"
    entao: "o arquivo tem cabeçalho age, não contém texto do dump nem segredo/.env, e nenhum dump em claro fica no disco"
    invariantes: []
    teste: ["tests/db/test_backup.py::test_backup_criptografado"]
  - id: SPEC-001-AC-14
    spec: SPEC-001
    dado: "um backup sintético (do tst) e o banco descartável restauracao vazio"
    quando: "o usuário roda scripts.restaurar (ADR 032: só o usuário executa)"
    entao: "contagem de linhas e somas por tabela iguais às de scripts.resumo_banco na origem"
    invariantes: []
    teste: []
    waiver: "humano: executado pelo usuário em 2026-11-02 (docs/operacao/backup-restore.md, passos 4-7) com backup sintético do tst abako-tst-20261102-104657.dump.age; scripts.resumo_banco na origem e a conferência de scripts.restaurar no descartável idênticas: alembic_version 1, conta_versao 2, transacao_versao 5 com soma(valor)=1526.59, usuario 1"
  - id: SPEC-002-AC-1
    spec: SPEC-002
    dado: "um usuário com senha definida pelo comando local"
    quando: "o login usa senha errada repetidas vezes"
    entao: "cada tentativa é rejeitada com 401 e, passado o limite, até a senha certa recebe 429"
    invariantes: []
    teste: ["tests/backend/test_login.py::test_rate_limit"]
  - id: SPEC-002-AC-2
    spec: SPEC-002
    dado: "dois usuários, cada um com suas contas"
    quando: "um deles lista ou busca contas, inclusive passando o id ou o user_id do outro"
    entao: "só recebe as próprias; a conta do outro responde 404"
    invariantes: [INV-13]
    teste: ["tests/backend/test_isolamento.py::test_acesso_cruzado_negado"]
  - id: SPEC-002-AC-3
    spec: SPEC-002
    dado: "a API no ar"
    quando: "a requisição chega com Host abako.localhost, localhost, 127.0.0.1 ou outro"
    entao: "os três primeiros são aceitos e qualquer outro recebe 400"
    invariantes: [INV-34]
    teste: ["tests/backend/test_host.py::test_host_permitido_e_invalido"]
  - id: SPEC-002-AC-4
    spec: SPEC-002
    dado: "uma sessão válida"
    quando: "uma escrita chega sem token CSRF, com token errado ou com Origin fora da lista"
    entao: "é rejeitada com 403; com token e Origin corretos, passa"
    invariantes: []
    teste: ["tests/backend/test_csrf.py::test_csrf_e_origin"]
  - id: SPEC-002-AC-5
    spec: SPEC-002
    dado: "login com sucesso, login com falha, uso da sessão e logout"
    quando: "os logs de todos os loggers são capturados"
    entao: "nem a senha, nem o token de sessão, nem o token CSRF aparecem"
    invariantes: []
    teste: ["tests/backend/test_logs.py::test_sem_segredo_em_log"]
  - id: SPEC-005-AC-1
    spec: SPEC-005
    dado: "uma compra parcelada no cartão (F-PARC-01, F-PARC-02, F-PARC-03)"
    quando: "as parcelas são geradas, para qualquer total e número de parcelas de 1 a 48"
    entao: "a soma das parcelas é o total, as n-1 primeiras valem o total dividido por n truncado em centavos e a última absorve o resto"
    invariantes: [INV-02]
    fixtures: [F-PARC-01, F-PARC-02, F-PARC-03]
    teste: ["tests/db/test_parcelas.py::test_ultima_absorve_centavos", "tests/db/test_parcelas.py::test_propriedade_soma_e_resto_na_ultima"]
  - id: SPEC-005-AC-2
    spec: SPEC-005
    dado: "compras com data, parcelas e fechamento do cartão (F-FECH-02, F-PARC-03)"
    quando: "a compra é gravada"
    entao: "cada parcela pertence à fatura da sua competência (mês do fechamento) e a competência fica gravada na parcela, com a data da compra"
    invariantes: [INV-07]
    fixtures: [F-FECH-02, F-PARC-03]
    teste: ["tests/db/test_fatura.py::test_parcela_na_competencia"]
  - id: SPEC-005-AC-3
    spec: SPEC-005
    dado: "uma linha de crédito com dois cartões, compras parceladas e um pagamento parcial (F-LIM-02)"
    quando: "o limite é consultado"
    entao: "o limite usado é o total das compras (com parcelas futuras) menos os pagamentos, o disponível pode ficar negativo e nada bloqueia a compra"
    invariantes: [INV-06]
    fixtures: [F-LIM-02]
    teste: ["tests/db/test_limite.py::test_limite_usado"]
  - id: SPEC-005-AC-4
    spec: SPEC-005
    dado: "compras diferentes com parcelas na mesma competência (F-FAT-02)"
    quando: "a fatura da competência é consultada"
    entao: "o total é a soma das parcelas da competência (terceiros só entram na SPEC-013)"
    invariantes: [INV-07]
    fixtures: [F-FAT-02]
    teste: ["tests/db/test_fatura.py::test_total_proprio_mais_terceiros"]
  - id: SPEC-005-AC-5
    spec: SPEC-005
    dado: "um cartão com fechamento no dia 31 (F-FECH-01)"
    quando: "o fechamento efetivo de um mês curto é calculado"
    entao: "usa o último dia válido do mês (fevereiro de 2026 é 28, de 2028 é 29, abril é 30)"
    invariantes: [INV-31]
    fixtures: [F-FECH-01]
    teste: ["tests/db/test_fechamento.py::test_dia_inexistente"]
  - id: SPEC-005-AC-6
    spec: SPEC-005
    dado: "um cartão com fechamento no dia 10 (F-FECH-02)"
    quando: "há compra antes, no dia e depois do fechamento"
    entao: "a compra no dia do fechamento e depois entra na fatura seguinte; antes, na que fecha (ADR 043)"
    invariantes: [INV-07, INV-31]
    fixtures: [F-FECH-02]
    teste: ["tests/db/test_fechamento.py::test_compra_no_dia_do_fechamento"]
  - id: SPEC-005-AC-7
    spec: SPEC-005
    dado: "um cartão cujo dia de fechamento mudou em uma data (F-FECH-03)"
    quando: "compras de antes e de depois da mudança são gravadas"
    entao: "cada compra usa o dia vigente na sua data e mudar o fechamento não recalcula as compras já feitas"
    invariantes: [INV-07]
    fixtures: [F-FECH-03]
    teste: ["tests/db/test_fechamento.py::test_vigencia_do_fechamento"]
  - id: SPEC-005-AC-8
    spec: SPEC-005
    dado: "uma conta corrente, um cartão com compra e um pagamento parcial da fatura (F-PAG-01)"
    quando: "o pagamento é lançado como transferência da corrente para o cartão"
    entao: "as pernas somam zero, a dívida diminui e devolve limite, e o pagamento não é gasto real"
    invariantes: [INV-01, INV-05]
    fixtures: [F-PAG-01]
    teste: ["tests/db/test_pagamento_fatura.py::test_pagamento_parcial_abate_a_divida"]
  - id: SPEC-005-AC-9
    spec: SPEC-005
    dado: "o lançamento do tipo crédito pela API (valor total positivo, número de parcelas, cartão)"
    quando: "é enviado a uma conta de cartão, a uma conta que não é de cartão, repetido com a mesma chave ou com versão desatualizada"
    entao: "grava uma parcela por mês com valor negativo na dívida; recusa conta que não é cartão; não duplica na repetição; responde 409 na versão desatualizada"
    invariantes: [INV-28, INV-29]
    teste: ["tests/backend/test_credito_api.py::test_credito_pela_api"]
  - id: SPEC-005-AC-10
    spec: SPEC-005
    dado: "uma compra parcelada gravada"
    quando: "é editada ou excluída"
    entao: "a edição cria nova versão da compra inteira (todas as parcelas), a anterior sai da fatura e do limite, e a exclusão lógica tira a compra de ambos"
    invariantes: [INV-09]
    teste: ["tests/db/test_parcelas.py::test_editar_e_excluir_compra_parcelada"]
  - id: SPEC-005-AC-11
    spec: SPEC-005
    dado: "um cartão com fechamento no dia 10 e a fatura da competência 2026-05 (fecha em 2026-05-10), ou um cartão sem dia de fechamento"
    quando: "a fatura é consultada na véspera do fechamento, no dia do fechamento e depois dele"
    entao: "a API devolve a data de fechamento efetivo e a situação aberta (hoje antes do fechamento) ou fechada (no dia ou depois), nula sem fechamento; não existe estado paga"
    invariantes: []
    teste:
      - "tests/backend/test_fatura_situacao_api.py::test_fatura_aberta_ou_fechada_pela_data"
      - "tests/backend/test_fatura_situacao_api.py::test_fatura_sem_fechamento_nao_tem_situacao"
      - "tests/backend/test_fatura_situacao_api.py::test_fatura_de_cartao_de_outro_usuario_da_404"
  - id: SPEC-006-AC-1
    spec: SPEC-006
    dado: "uma compra parcelada sem nenhuma parcela paga (F-EST-01)"
    quando: "a compra é estornada"
    entao: "o limite é devolvido por inteiro, a fatura aberta é reduzida e nenhum valor movimenta a conta corrente"
    invariantes: [INV-08]
    fixtures: [F-EST-01]
    teste: ["tests/db/test_estorno.py::test_f_est_01", "tests/backend/test_estorno_api.py::test_estorno_integral_f_est_01"]
  - id: SPEC-006-AC-2
    spec: SPEC-006
    dado: "uma compra parcelada com uma parcela quitada (F-EST-02)"
    quando: "a compra é estornada"
    entao: "o limite devolve a soma das parcelas não pagas e o valor pago vira crédito na próxima fatura aberta"
    invariantes: [INV-08]
    fixtures: [F-EST-02]
    teste: ["tests/db/test_estorno.py::test_f_est_02", "tests/backend/test_estorno_api.py::test_estorno_com_parcela_paga_f_est_02"]
  - id: SPEC-006-AC-3
    spec: SPEC-006
    dado: "qualquer compra estornada, com qualquer valor pago"
    quando: "se soma a compra, o limite devolvido e o crédito"
    entao: "o líquido da compra é zero (propriedade: −T + N + P = 0)"
    invariantes: [INV-08]
    fixtures: [F-EST-01, F-EST-02, F-EST-03, F-EST-05]
    teste: ["tests/db/test_estorno.py::test_liquido_zero"]
  - id: SPEC-006-AC-4
    spec: SPEC-006
    dado: "pagamento parcial que cobre uma parcela só em parte (F-EST-03)"
    quando: "a compra é estornada"
    entao: "o valor pago, inclusive o da parcela paga em parte, vira crédito, e o restante devolve limite"
    invariantes: [INV-08]
    fixtures: [F-EST-03]
    teste: ["tests/db/test_estorno.py::test_f_est_03", "tests/backend/test_estorno_api.py::test_estorno_com_parcela_paga_em_parte_f_est_03"]
  - id: SPEC-006-AC-5
    spec: SPEC-006
    dado: "duas compras no mesmo cartão e um pagamento solto (F-EST-04)"
    quando: "uma delas é estornada"
    entao: "o pago é alocado por competência, data da compra e parcela, e o crédito do estorno sai do pool de pagamentos"
    invariantes: [INV-08]
    fixtures: [F-EST-04]
    teste: ["tests/db/test_estorno.py::test_f_est_04"]
  - id: SPEC-006-AC-6
    spec: SPEC-006
    dado: "estorno lançado no dia do fechamento do cartão"
    quando: "o crédito é gravado"
    entao: "o crédito cai na fatura seguinte (ADR 043 item 1)"
    invariantes: [INV-08]
    teste: ["tests/db/test_estorno.py::test_estorno_no_dia_do_fechamento_cai_na_fatura_seguinte"]
  - id: SPEC-006-AC-7
    spec: SPEC-006
    dado: "pagamento maior que a dívida (F-EST-05)"
    quando: "a compra é estornada"
    entao: "o crédito é o total da compra, o saldo do cartão fica positivo e o excedente do pagamento permanece no pool"
    invariantes: [INV-08]
    fixtures: [F-EST-05]
    teste: ["tests/db/test_estorno.py::test_f_est_05"]
  - id: SPEC-006-AC-8
    spec: SPEC-006
    dado: "uma compra com alguma parte paga (F-EST-06)"
    quando: "se tenta editá-la ou excluí-la"
    entao: "a edição e a exclusão são recusadas, a compra vigente, o saldo e o limite não mudam; compra sem nada pago continua editável e excluível"
    invariantes: [INV-09]
    fixtures: [F-EST-06]
    teste: ["tests/db/test_estorno.py::test_f_est_06", "tests/db/test_estorno.py::test_corrida_pagamento_novo_antes_da_edicao_recusa_a_edicao", "tests/db/test_estorno.py::test_corrida_edicao_antes_do_pagamento_novo_serializa", "tests/backend/test_estorno_api.py::test_recusa_editar_e_excluir_compra_com_parte_paga_f_est_06"]
  - id: SPEC-006-AC-9
    spec: SPEC-006
    dado: "uma compra estornada"
    quando: "se consulta o histórico e o gasto real"
    entao: "a compra original é preservada, existe um único estorno ligado a ela e o gasto real sai das competências originais das parcelas"
    invariantes: [INV-08, INV-09]
    teste: ["tests/db/test_estorno.py::test_compra_original_preservada_e_um_estorno_por_compra"]
  - id: SPEC-006-AC-10
    spec: SPEC-006
    dado: "um cartão com um estorno gravado"
    quando: "se tenta editar ou excluir qualquer lançamento já gravado nele (pagamento, compra, compra estornada ou o próprio estorno)"
    entao: "a operação é recusada com mensagem clara e nada muda; lançamento novo (compra, pagamento) segue aceito (o pool de pagamentos nunca fica negativo)"
    invariantes: [INV-08, INV-09]
    teste: ["tests/db/test_estorno.py::test_depois_do_estorno_pagamento_compra_e_estorno_ficam_imutaveis", "tests/db/test_estorno.py::test_conversao_para_cartao_com_estorno_e_recusada", "tests/db/test_estorno.py::test_conta_do_cartao_com_estorno_nao_muda_de_tipo", "tests/backend/test_estorno_api.py::test_depois_do_estorno_nada_do_cartao_se_edita"]
  - id: SPEC-006-AC-11
    spec: SPEC-006
    dado: "uma compra parcelada estornada, com parcelas em competências anteriores à do crédito"
    quando: "se consultam as faturas"
    entao: "as faturas de competência anterior à do crédito mantêm o valor e a compra; da competência do crédito em diante a compra sai e o crédito P aparece na do estorno; o gasto real segue saindo das competências originais"
    invariantes: [INV-08]
    teste: ["tests/db/test_estorno.py::test_faturas_antigas_nao_mudam", "tests/backend/test_estorno_api.py::test_estorno_com_parcela_paga_f_est_02"]
  - id: SPEC-012-AC-1
    spec: SPEC-012
    dado: "o contrato OpenAPI da API e o cliente TypeScript versionado em frontend/"
    quando: "a API muda sem que o contrato exportado ou o cliente gerado sejam atualizados"
    entao: "a checagem falha, apontando o comando que conserta (exportar_openapi e gen:api)"
    invariantes: []
    teste: ["tests/contracts/test_cliente_openapi.py::test_cliente_atualizado"]
  - id: SPEC-012-AC-2
    spec: SPEC-012
    dado: "uma sessão aberta no app"
    quando: "o usuário clica em Sair"
    entao: "a sessão é encerrada, todos os caches da PWA são apagados (mesmo se o servidor não responder) e a tela de login volta"
    invariantes: []
    teste: ["frontend/src/login/Login.test.tsx::logout_limpa_cache"]
  - id: SPEC-012-AC-3
    spec: SPEC-012
    dado: "o código de produção do front (fora do cliente gerado)"
    quando: "se procura conversão numérica ou aritmética de valor (parseFloat, Number, toFixed, Math, Intl.NumberFormat)"
    entao: "não há nenhuma, e um valor decimal acima de 2^53 é exibido sem perder dígitos"
    invariantes: [INV-14]
    teste: ["frontend/src/dinheiro.test.ts::sem_float"]
  - id: SPEC-012-AC-4
    spec: SPEC-012
    dado: "a API devolve o saldo de cada conta como texto (inclusive acima de 2^53 e negativo)"
    quando: "a tela de contas é aberta"
    entao: "cada conta mostra exatamente o saldo da API, só formatado como moeda, sem recalcular, com os estados carregando, vazio e erro tratados"
    invariantes: [INV-14]
    teste:
      - "frontend/src/saldos/Saldos.test.tsx::mostra_saldo_da_api"
      - "frontend/src/saldos/Saldos.test.tsx::mostra_carregando_ate_a_api_responder"
      - "frontend/src/saldos/Saldos.test.tsx::mostra_estado_vazio"
      - "frontend/src/saldos/Saldos.test.tsx::mostra_erro_e_tenta_de_novo"
  - id: SPEC-012-AC-5
    spec: SPEC-012
    dado: "uma conta com saldo calculado"
    quando: "o usuário informa o saldo do banco (snapshot) e a API responde com divergência"
    entao: "a tela mostra a divergência, o saldo calculado e o informado como a API devolveu, avisa que nada foi corrigido e recarrega a lista"
    invariantes: [INV-03, INV-23]
    teste: ["frontend/src/saldos/Snapshot.test.tsx::mostra_divergencia"]
  - id: SPEC-012-AC-6
